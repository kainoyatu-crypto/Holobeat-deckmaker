name: Sync Horobeat Tournament Results

on:
  schedule:
    # 毎日 JST 21:00（UTC 12:00）に自動実行
    - cron: "0 12 * * *"
  workflow_dispatch: # GitHub画面から手動でテスト実行できるようにする

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tournament sync script
        run: python scripts/sync_tournaments.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tournament_results.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync horobeat tournament results"
            git push
          fi
