name: Sync Horobeat Events

on:
  schedule:
    # 毎日 JST 21:00（UTC 12:00）に自動実行
    - cron: "0 12 * * *"
  push:
    paths:
      - "scripts/fetch_event_dates.py"
      - ".github/workflows/sync-events.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-events:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Fetch event dates
        run: python scripts/fetch_event_dates.py

      - name: Commit and push updated events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync horobeat events.json"
            git push
          fi
