<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HOROBEAT STUDIO — 公認大会まとめ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    :root {
      --bg: #f4f4f6;
      --surface: #ffffff;
      --surface-sub: #f8f9fa;
      --ink: #111114;
      --ink-sub: #52525b;
      --line: #d4d4d8;
      --line-strong: #111114;
      --accent: #111114;
      --accent-ink: #ffffff;
      --tag-bg: #eef2ff;
      --tag-ink: #1d4ed8;
      --ok-bg: #dcfce7;
      --ok-ink: #15803d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", "Noto Sans JP", sans-serif;
      line-height: 1.35;
    }

    .app-wrap {
      height: 100dvh;
      padding-top: max(42px, calc(28px + env(safe-area-inset-top)));
      padding-right: 6px;
      padding-bottom: 0;
      padding-left: 6px;
      display: flex;
      justify-content: center;
    }

    .sheet {
      width: 100%;
      max-width: 960px;
      height: 100%;
      background: var(--surface);
      border-top: 1.5px solid var(--line-strong);
      border-right: 1.5px solid var(--line-strong);
      border-left: 1.5px solid var(--line-strong);
      border-bottom: none;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .brand-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1.5px solid var(--line-strong);
      flex-shrink: 0;
    }

    .title-link {
      text-decoration: none;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .title-link:hover .brand-name {
      text-decoration: underline;
    }

    .brand-name {
      margin: 0;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .mini-status {
      font-size: 10px;
      color: var(--ink-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-header {
      display: grid;
      grid-template-columns: 1fr auto;
      border-bottom: 1.5px solid var(--line-strong);
      flex-shrink: 0;
    }

    .title-main {
      padding: 6px 12px;
      font-size: 16px;
      font-weight: 900;
      display: flex;
      align-items: center;
    }

    .planned-box {
      padding: 4px 12px;
      border-left: 1.5px solid var(--line-strong);
      text-align: center;
      min-width: 92px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .planned-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--ink-sub);
    }

    .planned-count {
      font-size: 15px;
      font-weight: 900;
    }

    .filter-stack {
      border-bottom: 1.5px solid var(--line-strong);
      flex-shrink: 0;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 78px 1fr;
      align-items: center;
      border-bottom: 1px solid var(--line);
    }

    .filter-row:last-child {
      border-bottom: none;
    }

    .filter-key {
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 800;
      border-right: 1px solid var(--line);
      background: var(--surface-sub);
    }

    .filter-val {
      padding: 3px 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-input,
    .ctrl-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 5px;
      padding: 4px 7px;
      font-size: 12px;
      font-family: inherit;
      background: var(--surface);
      color: var(--ink);
    }

    .date-row-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
    }

    .date-md-badge {
      font-size: 12px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--surface-sub);
      border: 1px solid var(--line);
      white-space: nowrap;
    }

    .view-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1.5px solid var(--line-strong);
      flex-shrink: 0;
    }

    .view-tab {
      border: none;
      background: var(--surface);
      color: var(--ink);
      padding: 6px 8px;
      font-size: 13px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
    }

    .view-tab + .view-tab {
      border-left: 1.5px solid var(--line-strong);
    }

    .view-tab.active {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .month-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--surface-sub);
      gap: 6px;
      flex-shrink: 0;
    }

    .month-label {
      font-size: 13px;
      font-weight: 900;
    }

    .btn {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }

    .btn.active {
      background: var(--accent);
      color: var(--accent-ink);
    }

    .workspace-body {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #calendarSection {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      grid-auto-rows: 1fr;
      border-bottom: 1px solid var(--line-strong);
      flex: 1;
      min-height: 0;
    }

    .dow {
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 2px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface-sub);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dow:nth-child(7n) { border-right: none; }
    .dow.sun { color: #dc2626; }
    .dow.sat { color: #2563eb; }

    .cell {
      padding: 2px 3px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 1px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .cell:nth-child(7n) { border-right: none; }
    .cell.out { background: #fafafa; color: #a1a1aa; }
    .cell.sel {
      background: #eff6ff;
      box-shadow: inset 0 0 0 1.5px var(--line-strong);
    }

    .cell-num {
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .ev-chip {
      font-size: 9px;
      font-weight: 700;
      padding: 1px 3px;
      border-radius: 3px;
      background: var(--tag-bg);
      color: var(--tag-ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }

    .ev-chip.planned {
      background: var(--ok-bg);
      color: var(--ok-ink);
    }

    #mapSection {
      flex: 1;
      min-height: 0;
      display: none;
    }

    #mapBox {
      width: 100%;
      height: 100%;
      border-bottom: 1px solid var(--line-strong);
      z-index: 1;
    }

    .detail-area {
      padding: 6px 10px calc(10px + env(safe-area-inset-bottom));
      height: 146px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .detail-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      gap: 6px;
      flex-shrink: 0;
    }

    .detail-title {
      margin: 0;
      font-size: 12px;
      font-weight: 900;
    }

    .ev-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .ev-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 5px 8px;
      background: var(--surface-sub);
    }

    .ev-card-title {
      margin: 1px 0;
      font-size: 12px;
      font-weight: 800;
    }

    .ev-card-meta {
      font-size: 10px;
      color: var(--ink-sub);
    }

    .ev-card-actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="app-wrap">
    <div class="sheet">
      <div class="brand-bar">
        <a href="./index.html" id="titleBackToTop" class="title-link" title="トップページへ戻る">
          <h1 class="brand-name">HOROBEAT STUDIO</h1>
        </a>
        <span class="mini-status" id="dataSourceStatus">./data/events.json 確認中...</span>
      </div>

      <div class="title-header">
        <div class="title-main">公認大会まとめ</div>
        <div class="planned-box">
          <span class="planned-label">参加予定</span>
          <span class="planned-count" id="plannedCount">0件</span>
        </div>
      </div>

      <div class="filter-stack">
        <div class="filter-row">
          <label class="filter-key" for="areaInput">駅・エリア</label>
          <div class="filter-val">
            <input id="areaInput" class="ctrl-input" type="text" placeholder="例: 立川、新宿、秋葉原、店舗名" />
          </div>
        </div>

        <div class="filter-row">
          <label class="filter-key" for="categorySelect">種別</label>
          <div class="filter-val">
            <select id="categorySelect" class="ctrl-select">
              <option value="">すべて</option>
              <option value="名人戦">名人戦</option>
              <option value="体験会">体験会</option>
              <option value="店舗大会">店舗大会</option>
            </select>
          </div>
        </div>

        <div class="filter-row">
          <label class="filter-key" for="dateInput">日程</label>
          <div class="filter-val">
            <div class="date-row-inner">
              <input id="dateInput" class="ctrl-input" type="date" value="2026-11-22" style="max-width: 148px;" />
              <span class="date-md-badge" id="dateMdLabel">11 / 22</span>
              <button type="button" id="reloadBtn" class="btn">再読込</button>
            </div>
          </div>
        </div>
      </div>

      <div class="view-switcher" role="tablist">
        <button type="button" id="tabCalendar" class="view-tab active" data-view="calendar">カレンダー</button>
        <button type="button" id="tabMap" class="view-tab" data-view="map">地図</button>
      </div>

      <div class="workspace-body">
        <div id="calendarSection">
          <div class="month-bar">
            <div class="month-label" id="monthTitle">11月（2026年11月）</div>
            <div style="display:flex;gap:4px;">
              <button type="button" id="prevMonth" class="btn">◀ 前月</button>
              <button type="button" id="resetDate" class="btn">11/22</button>
              <button type="button" id="nextMonth" class="btn">翌月 ▶</button>
            </div>
          </div>
          <div id="calGrid" class="cal-grid"></div>
        </div>

        <div id="mapSection">
          <div id="mapBox"></div>
        </div>

        <div class="detail-area">
          <div class="detail-head">
            <h2 class="detail-title" id="listHeading">11/22 の大会・イベント</h2>
            <span class="ev-card-meta" id="listCount">0件</span>
          </div>
          <div id="eventList" class="ev-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const PREF_KEY = "horobeat_planned_events_v1";
    const FALLBACK_EVENTS = [
      {
        id: "sample-1122-tachikawa",
        title: "ホロビート名人戦（立川エリア）",
        category: "名人戦",
        date: "2026-11-22",
        time: "14:00",
        area: "立川",
        venue: "立川駅周辺 対象店舗",
        lat: 35.6982,
        lng: 139.4136,
        sourceUrl: "https://www.takaratomy.co.jp/products/horobeat-cardgame/event/hb-meijinsen-2611-2701/",
        notes: "data/events.json 未配置時の表示サンプルです。"
      }
    ];

    let allEvents = [];
    let year = 2026;
    let month = 10;
    let selectedDate = "2026-11-22";
    let activeView = "calendar";
    let map = null;
    let markerLayer = null;

    const esc = (v) =>
      String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");

    const loadPlannedSet = () => {
      try {
        return new Set(JSON.parse(localStorage.getItem(PREF_KEY) || "[]"));
      } catch {
        return new Set();
      }
    };

    const savePlannedSet = (set) => {
      try {
        localStorage.setItem(PREF_KEY, JSON.stringify(Array.from(set)));
      } catch {}
    };

    window.togglePlan = (id) => {
      const set = loadPlannedSet();
      if (set.has(id)) set.delete(id);
      else set.add(id);
      savePlannedSet(set);
      render();
    };

    const updateDateMdLabel = (iso) => {
      const m = String(iso || "").match(/^\d{4}-(\d{2})-(\d{2})$/);
      document.getElementById("dateMdLabel").textContent = m ? `${Number(m[1])} / ${Number(m[2])}` : "-- / --";
    };

    const getFilteredEvents = () => {
      const areaQ = document.getElementById("areaInput").value.trim().toLowerCase();
      const catQ = document.getElementById("categorySelect").value;
      const plannedSet = loadPlannedSet();

      return allEvents
        .map((ev) => ({
          ...ev,
          planned: plannedSet.has(ev.id)
        }))
        .filter((ev) => {
          if (catQ && ev.category !== catQ) return false;
          if (areaQ) {
            const hay = `${ev.area || ""} ${ev.venue || ""} ${ev.title || ""} ${ev.notes || ""}`.toLowerCase();
            if (!hay.includes(areaQ)) return false;
          }
          return true;
        });
    };

    const renderCalendar = (filtered) => {
      document.getElementById("monthTitle").textContent = `${month + 1}月（${year}年${month + 1}月）`;
      const grid = document.getElementById("calGrid");
      const dows = [
        { label: "日", cls: "sun" },
        { label: "月", cls: "" },
        { label: "火", cls: "" },
        { label: "水", cls: "" },
        { label: "木", cls: "" },
        { label: "金", cls: "" },
        { label: "土", cls: "sat" }
      ];

      const byDate = new Map();
      filtered.forEach((ev) => {
        if (!ev.date) return;
        if (!byDate.has(ev.date)) byDate.set(ev.date, []);
        byDate.get(ev.date).push(ev);
      });

      const firstDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const prevMonthDays = new Date(year, month, 0).getDate();
      const pad = (n) => String(n).padStart(2, "0");

      let html = dows.map((d) => `<div class="dow ${d.cls}">${d.label}</div>`).join("");

      for (let i = firstDow - 1; i >= 0; i--) {
        const dNum = prevMonthDays - i;
        const m = month === 0 ? 12 : month;
        const y = month === 0 ? year - 1 : year;
        html += `<div class="cell out" data-date="${y}-${pad(m)}-${pad(dNum)}"><span class="cell-num">${dNum}</span></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const iso = `${year}-${pad(month + 1)}-${pad(d)}`;
        const items = byDate.get(iso) || [];
        const sel = iso === selectedDate ? "sel" : "";
        const chips = items
          .slice(0, 2)
          .map(
            (ev) =>
              `<div class="ev-chip ${ev.planned ? "planned" : ""}">${esc(ev.area ? `[${ev.area}] ` : "")}${esc(ev.title)}</div>`
          )
          .join("");
        html += `<div class="cell ${sel}" data-date="${iso}"><span class="cell-num">${d}</span>${chips}</div>`;
      }

      const cellsSoFar = firstDow + daysInMonth;
      const trailing = (7 - (cellsSoFar % 7)) % 7;
      for (let t = 1; t <= trailing; t++) {
        const m = month === 11 ? 1 : month + 2;
        const y = month === 11 ? year + 1 : year;
        html += `<div class="cell out" data-date="${y}-${pad(m)}-${pad(t)}"><span class="cell-num">${t}</span></div>`;
      }

      grid.innerHTML = html;
      grid.querySelectorAll(".cell").forEach((el) => {
        el.addEventListener("click", () => {
          selectedDate = el.getAttribute("data-date");
          document.getElementById("dateInput").value = selectedDate;
          const [y, m] = selectedDate.split("-").map(Number);
          if (y && m) {
            year = y;
            month = m - 1;
          }
          render();
        });
      });

      return byDate.get(selectedDate) || [];
    };

    const ensureMap = () => {
      if (map || typeof L === "undefined") return;
      map = L.map("mapBox").setView([35.6982, 139.4136], 10);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: "&copy; OpenStreetMap contributors"
      }).addTo(map);
      markerLayer = L.layerGroup().addTo(map);
    };

    const renderMap = (filtered) => {
      ensureMap();
      if (!map || !markerLayer) return;
      markerLayer.clearLayers();
      const bounds = [];
      filtered.forEach((ev) => {
        if (typeof ev.lat === "number" && typeof ev.lng === "number") {
          const mk = L.marker([ev.lat, ev.lng]).addTo(markerLayer);
          mk.bindPopup(`<strong>${esc(ev.title)}</strong><br/>${esc(ev.date || "")} ${esc(ev.time || "")}<br/>${esc(ev.venue || "")}`);
          bounds.push([ev.lat, ev.lng]);
        }
      });
      setTimeout(() => {
        map.invalidateSize();
        if (bounds.length) map.fitBounds(bounds, { padding: [24, 24], maxZoom: 13 });
      }, 60);
    };

    window.jumpToMap = (lat, lng) => {
      switchView("map");
      ensureMap();
      setTimeout(() => {
        if (map) {
          map.invalidateSize();
          map.setView([lat, lng], 14);
        }
      }, 80);
    };

    const renderList = (dayItems, allFiltered) => {
      const items = activeView === "calendar" ? dayItems : allFiltered;
      const m = selectedDate.match(/^\d{4}-(\d{2})-(\d{2})$/);
      const mdText = m ? `${Number(m[1])}/${Number(m[2])}` : selectedDate;

      document.getElementById("listHeading").textContent =
        activeView === "calendar" ? `${mdText} の大会・イベント` : "絞り込み中の大会・イベント";
      document.getElementById("listCount").textContent = `${items.length}件`;

      const box = document.getElementById("eventList");
      if (!items.length) {
        box.innerHTML = `<div class="ev-card"><div class="ev-card-meta">該当するイベントはありません。</div></div>`;
        return;
      }

      box.innerHTML = items
        .map(
          (ev) => `
          <div class="ev-card">
            <div class="ev-card-meta">${esc(ev.category || "大会")} ｜ ${esc(ev.date || "")} ${esc(ev.time || "")} ｜ ${esc(ev.area || "")}（${esc(ev.venue || "")}）</div>
            <div class="ev-card-title">${esc(ev.title || "")}</div>
            <div class="ev-card-actions">
              <button type="button" class="btn ${ev.planned ? "active" : ""}" onclick="togglePlan('${esc(ev.id)}')">
                ${ev.planned ? "参加予定 ✓" : "参加予定にする"}
              </button>
              <button type="button" class="btn" onclick="jumpToMap(${Number(ev.lat || 35.6982)}, ${Number(ev.lng || 139.4136)})">地図で見る</button>
              ${ev.sourceUrl ? `<a class="btn" href="${esc(ev.sourceUrl)}" target="_blank" rel="noopener noreferrer">公式</a>` : ""}
            </div>
          </div>
        `
        )
        .join("");
    };

    const switchView = (nextView) => {
      activeView = nextView;
      document.getElementById("tabCalendar").classList.toggle("active", nextView === "calendar");
      document.getElementById("tabMap").classList.toggle("active", nextView === "map");
      document.getElementById("calendarSection").style.display = nextView === "calendar" ? "flex" : "none";
      document.getElementById("mapSection").style.display = nextView === "map" ? "block" : "none";
      render();
    };

    const render = () => {
      updateDateMdLabel(selectedDate);
      const filtered = getFilteredEvents();
      const plannedSet = loadPlannedSet();
      const plannedShown = filtered.filter((e) => plannedSet.has(e.id)).length;
      document.getElementById("plannedCount").textContent = `${plannedShown}件`;

      const dayItems = renderCalendar(filtered);
      if (activeView === "map") renderMap(filtered);
      renderList(dayItems, filtered);
    };

    const loadData = async () => {
      try {
        const res = await fetch("./data/events.json?_=" + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (Array.isArray(json) && json.length) {
            allEvents = json;
            document.getElementById("dataSourceStatus").textContent = `同期済（${allEvents.length}件）`;
            render();
            return;
          }
        }
      } catch {}
      allEvents = FALLBACK_EVENTS;
      document.getElementById("dataSourceStatus").textContent = "サンプル表示中";
      render();
    };

    const titleLink = document.getElementById("titleBackToTop");
    if (titleLink) {
      titleLink.addEventListener("click", (e) => {
        e.preventDefault();
        window.location.href = "./index.html";
      });
    }

    document.getElementById("tabCalendar").addEventListener("click", () => switchView("calendar"));
    document.getElementById("tabMap").addEventListener("click", () => switchView("map"));
    document.getElementById("areaInput").addEventListener("input", render);
    document.getElementById("categorySelect").addEventListener("change", render);
    document.getElementById("reloadBtn").addEventListener("click", loadData);

    document.getElementById("dateInput").addEventListener("change", (e) => {
      if (!e.target.value) return;
      selectedDate = e.target.value;
      const [y, m] = selectedDate.split("-").map(Number);
      if (y && m) {
        year = y;
        month = m - 1;
      }
      render();
    });

    document.getElementById("prevMonth").addEventListener("click", () => {
      month -= 1;
      if (month < 0) { month = 11; year -= 1; }
      render();
    });

    document.getElementById("nextMonth").addEventListener("click", () => {
      month += 1;
      if (month > 11) { month = 0; year += 1; }
      render();
    });

    document.getElementById("resetDate").addEventListener("click", () => {
      year = 2026;
      month = 10;
      selectedDate = "2026-11-22";
      document.getElementById("dateInput").value = selectedDate;
      render();
    });

    loadData();
  </script>
</body>
</html>
