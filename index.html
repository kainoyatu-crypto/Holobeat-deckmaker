<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>デッキ作成 - HOROBEAT STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
--bg: #f4f4f6;
--paper: #ffffff;
--sub: #ececef;
--ink: #111114;
--muted: #666670;
--line: #222429;
--soft-line: #dfe1e7;
--accent: #111114;
--badge-bg: #f0f1f5;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
html, body {
height: 100%;
background-color: var(--bg);
color: var(--ink);
font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
overflow: hidden;
}
.builder-screen {
height: 100dvh;
width: 100%;
display: flex;
flex-direction: column;
padding: 8px 10px;
gap: 8px;
overflow: hidden;
}
.builder-header {
background: var(--paper);
border: 1.5px solid var(--line);
border-radius: 5px;
padding: 6px 12px;
display: flex;
align-items: center;
justify-content: space-between;
gap: 8px;
flex-shrink: 0;
}
.brand-home-link {
font-family: "Playfair Display", Georgia, serif;
font-size: 1.05rem;
font-weight: 700;
letter-spacing: 0.05em;
color: var(--ink);
text-decoration: none;
padding: 2px 4px;
}
.brand-home-link:hover {
text-decoration: underline;
}
.header-status-group {
display: flex;
align-items: center;
gap: 6px;
flex-wrap: wrap;
font-size: 0.74rem;
}
.pill {
background: var(--badge-bg);
border: 1px solid var(--soft-line);
border-radius: 999px;
padding: 2px 8px;
font-weight: 700;
color: var(--ink);
}
.btn {
background: var(--paper);
color: var(--ink);
border: 1px solid var(--line);
border-radius: 4px;
padding: 4px 8px;
font-size: 0.74rem;
font-weight: 700;
cursor: pointer;
box-shadow: 1.5px 1.5px 0 var(--line);
white-space: nowrap;
}
.btn:hover {
background: var(--accent);
color: var(--paper);
}
.btn.active {
background: var(--accent);
color: var(--paper);
}
.builder-workspace {
flex: 1;
min-height: 0;
display: grid;
grid-template-columns: 1.25fr 1fr;
gap: 8px;
}
@media (max-width: 820px) {
.builder-workspace {
grid-template-columns: 1fr;
grid-template-rows: 1.05fr 1fr;
}
}
.pane {
background: var(--paper);
border: 1.5px solid var(--line);
border-radius: 5px;
padding: 8px 10px;
display: flex;
flex-direction: column;
gap: 6px;
min-height: 0;
overflow: hidden;
}
.pane-guide {
font-size: 0.71rem;
color: var(--muted);
background: var(--sub);
border-radius: 4px;
padding: 4px 8px;
flex-shrink: 0;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.filter-bar {
display: flex;
gap: 5px;
flex-wrap: nowrap;
overflow-x: auto;
flex-shrink: 0;
padding-bottom: 2px;
}
.filter-bar input,
.filter-bar select {
border: 1px solid var(--line);
border-radius: 4px;
padding: 3px 6px;
font-size: 0.73rem;
background: var(--paper);
color: var(--ink);
min-width: 0;
}
.filter-bar input {
width: 130px;
flex-shrink: 0;
}
.catalog-grid {
flex: 1;
min-height: 0;
overflow-y: auto;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
gap: 6px;
align-content: start;
padding-right: 2px;
}
.catalog-card {
border: 1px solid var(--soft-line);
border-radius: 4px;
padding: 5px;
background: #fcfcfd;
display: flex;
flex-direction: column;
gap: 3px;
cursor: pointer;
user-select: none;
touch-action: none;
}
.catalog-card:hover {
border-color: var(--line);
}
.card-img {
width: 100%;
aspect-ratio: 3 / 4;
object-fit: cover;
border-radius: 3px;
background: var(--badge-bg);
}
.card-ph {
width: 100%;
aspect-ratio: 3 / 4;
border-radius: 3px;
background: var(--badge-bg);
border: 1px dashed var(--soft-line);
display: flex;
align-items: center;
justify-content: center;
font-size: 0.68rem;
color: var(--muted);
text-align: center;
padding: 3px;
}
.card-title {
font-size: 0.73rem;
font-weight: 700;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.card-meta {
font-size: 0.66rem;
color: var(--muted);
display: flex;
justify-content: space-between;
}
.deck-fn-bar {
display: flex;
align-items: center;
gap: 5px;
flex-wrap: nowrap;
overflow-x: auto;
padding-bottom: 4px;
border-bottom: 1px solid var(--soft-line);
flex-shrink: 0;
}
.deck-fn-bar input {
width: 118px;
flex-shrink: 0;
border: 1px solid var(--line);
border-radius: 4px;
padding: 3px 6px;
font-size: 0.73rem;
}
.deck-fn-bar select {
max-width: 112px;
flex-shrink: 0;
border: 1px solid var(--line);
border-radius: 4px;
padding: 3px 5px;
font-size: 0.72rem;
}
.deck-scroll-area {
flex: 1;
min-height: 0;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 6px;
padding-right: 2px;
}
.deck-grid-50 {
display: grid;
grid-template-columns: repeat(10, 1fr);
gap: 4px;
align-content: start;
}
@media (max-width: 720px) {
.deck-grid-50 {
grid-template-columns: repeat(5, 1fr);
}
}
.deck-slot {
aspect-ratio: 3 / 4;
border: 1px solid var(--soft-line);
border-radius: 3px;
background: #fafafa;
display: flex;
flex-direction: column;
justify-content: space-between;
padding: 3px;
font-size: 0.62rem;
overflow: hidden;
cursor: pointer;
user-select: none;
touch-action: none;
position: relative;
}
.deck-slot.filled {
border-color: var(--line);
background: var(--paper);
}
.deck-slot img {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
object-fit: cover;
opacity: 0.28;
pointer-events: none;
}
.deck-slot-inner {
position: relative;
z-index: 1;
height: 100%;
display: flex;
flex-direction: column;
justify-content: space-between;
pointer-events: none;
}
.deck-slot-name {
font-weight: 700;
line-height: 1.15;
word-break: break-all;
}
.deck-slot-sub {
color: var(--muted);
font-size: 0.58rem;
}
.sub-deck-strip {
border-top: 1px dashed var(--soft-line);
padding-top: 4px;
display: flex;
flex-direction: column;
gap: 4px;
flex-shrink: 0;
}
.sub-deck-title {
font-size: 0.7rem;
font-weight: 700;
color: var(--muted);
display: flex;
justify-content: space-between;
}
.sub-deck-chips {
display: flex;
gap: 4px;
overflow-x: auto;
padding-bottom: 2px;
}
.sub-chip {
border: 1px solid var(--line);
border-radius: 4px;
background: var(--badge-bg);
padding: 2px 6px;
font-size: 0.68rem;
font-weight: 700;
white-space: nowrap;
cursor: pointer;
}
.overlay {
position: fixed;
inset: 0;
background: rgba(17, 17, 20, 0.45);
display: none;
align-items: center;
justify-content: center;
padding: 14px;
z-index: 50;
}
.overlay.open {
display: flex;
}
.modal-box {
width: 100%;
max-width: 440px;
max-height: 86dvh;
overflow-y: auto;
background: var(--paper);
border: 2px solid var(--line);
border-radius: 6px;
padding: 14px 16px;
display: flex;
flex-direction: column;
gap: 10px;
box-shadow: 5px 5px 0 var(--line);
}
.modal-head {
display: flex;
align-items: center;
justify-content: space-between;
border-bottom: 1px solid var(--soft-line);
padding-bottom: 6px;
font-size: 0.9rem;
font-weight: 700;
}
.modal-img {
width: 140px;
aspect-ratio: 3 / 4;
object-fit: cover;
border-radius: 4px;
border: 1px solid var(--line);
align-self: center;
}
.variant-row {
display: flex;
flex-wrap: wrap;
gap: 6px;
}
.modal-textarea {
width: 100%;
min-height: 110px;
border: 1px solid var(--line);
border-radius: 4px;
padding: 8px;
font-size: 0.78rem;
font-family: inherit;
}
.toast-bar {
position: fixed;
bottom: 12px;
left: 50%;
transform: translateX(-50%);
background: var(--accent);
color: var(--paper);
padding: 6px 14px;
border-radius: 999px;
font-size: 0.76rem;
font-weight: 700;
z-index: 80;
opacity: 0;
pointer-events: none;
transition: opacity 0.16s ease;
}
.toast-bar.show {
opacity: 1;
}
</style>
</head>
<body>
<section class="builder-screen" aria-label="デッキ作成">
<header class="builder-header">
<a href="./index.html" class="brand-home-link" title="トップページへ戻る">
HOROBEAT STUDIO
</a>
<div class="header-status-group">
<span class="pill" id="pillMainCount">メイン: 0 / 50</span>
<span class="pill" id="pillSubCount">サブ: 0 / 10</span>
<span class="pill" id="pillCardSource">読込中</span>
</div>
</header>
<div class="builder-workspace">
<div class="pane">
<div class="pane-guide">
タップ・上スワイプで追加 / 長押し・詳細で拡大表示・レアリティ変更
</div>
<div class="filter-bar">
<input type="text" id="searchInput" placeholder="名前・型番検索" />
<select id="filterColor"><option value="">全色</option></select>
<select id="filterCiv"><option value="">全文明</option></select>
<select id="filterType"><option value="">全種類</option></select>
<select id="filterRarity"><option value="">全レア</option></select>
<select id="sortSelect">
<option value="code">型番順</option>
<option value="cost-asc">コスト昇順</option>
<option value="cost-desc">コスト降順</option>
<option value="name">名前順</option>
</select>
</div>
<div class="catalog-grid" id="catalogGrid"></div>
</div>
<div class="pane">
<div class="pane-guide">
デッキ内：タップ・下スワイプで1枚削除 / 長押しで拡大・レアリティ変更
</div>
<div class="deck-fn-bar">
<input type="text" id="deckNameInput" placeholder="デッキ名" />
<button type="button" class="btn" id="btnSaveDeck">保存</button>
<select id="savedDeckSelect"><option value="">読込...</option></select>
<button type="button" class="btn" id="btnLoadDeck">呼出</button>
<button type="button" class="btn" id="btnOpenShare">出力/URL</button>
<button type="button" class="btn" id="btnOpenStats">統計</button>
<button type="button" class="btn" id="btnClearAll">クリア</button>
</div>
<div class="deck-scroll-area">
<div class="deck-grid-50" id="deckGrid50"></div>
<div class="sub-deck-strip">
<div class="sub-deck-title">
<span>サブ・調整枠</span>
<span id="subDeckCountText">0 / 10</span>
</div>
<div class="sub-deck-chips" id="subDeckChips"></div>
</div>
</div>
</div>
</div>
</section>
<div class="overlay" id="detailOverlay">
<div class="modal-box">
<div class="modal-head">
<span id="detailTitle">カード詳細</span>
<button type="button" class="btn" id="btnCloseDetail">閉じる</button>
</div>
<img id="detailImg" class="modal-img" alt="" style="display:none;" />
<div id="detailMeta" style="font-size:0.78rem;color:var(--muted);"></div>
<p id="detailText" style="font-size:0.82rem;line-height:1.5;"></p>
<div id="copyTabsWrap" style="display:none;flex-direction:column;gap:4px;">
<span style="font-size:0.75rem;font-weight:700;">デッキ内の枚数ごとにレアリティを選択</span>
<div class="variant-row" id="copyTabsRow"></div>
</div>
<div style="display:flex;flex-direction:column;gap:4px;">
<span style="font-size:0.75rem;font-weight:700;">レアリティ変更</span>
<div class="variant-row" id="variantButtonsRow"></div>
</div>
<div class="variant-row" style="margin-top:4px;">
<button type="button" class="btn" id="btnDetailAddMain">メインに1枚追加</button>
<button type="button" class="btn" id="btnDetailAddSub">サブに1枚追加</button>
<button type="button" class="btn" id="btnDetailRemoveOne">1枚削除</button>
</div>
</div>
</div>
<div class="overlay" id="shareOverlay">
<div class="modal-box">
<div class="modal-head">
<span>テキスト出力・読込 / 共有URL</span>
<button type="button" class="btn" id="btnCloseShare">閉じる</button>
</div>
<textarea class="modal-textarea" id="recipeTextarea" placeholder="レシピテキスト"></textarea>
<div class="variant-row">
<button type="button" class="btn" id="btnCopyRecipeText">テキストコピー</button>
<button type="button" class="btn" id="btnApplyRecipeText">テキストから読込</button>
<button type="button" class="btn" id="btnCopyShareLink">共有URLコピー</button>
</div>
</div>
</div>
<div class="overlay" id="statsOverlay">
<div class="modal-box">
<div class="modal-head">
<span>デッキ統計（メイン）</span>
<button type="button" class="btn" id="btnCloseStats">閉じる</button>
</div>
<div id="statsBody" style="font-size:0.8rem;line-height:1.6;"></div>
</div>
</div>
<div class="toast-bar" id="toastBar"></div>
<script>
(function () {
const SAVED_DECKS_KEY = "horobeat_studio_decks_v2";
const FALLBACK_CARDS = [
{
id: "HB01-001",
code: "HB01-001",
name: "リズム・ストライカー",
cost: 2,
color: "赤",
civilization: "ビート",
type: "ユニット",
rarity: "C",
text: "登場時：相手ユニット1体に1ダメージ。",
image: "",
variants: [
{ label: "C", image: "" },
{ label: "SR", image: "" }
]
},
{
id: "HB01-002",
code: "HB01-002",
name: "メロディ・ガードナー",
cost: 3,
color: "青",
civilization: "ハーモニー",
type: "ユニット",
rarity: "R",
text: "自分のターン中、味方全体のコスト+1。",
image: "",
variants: [
{ label: "R", image: "" },
{ label: "パラレル", image: "" }
]
},
{
id: "HB01-003",
code: "HB01-003",
name: "アンコール・ステップ",
cost: 1,
color: "緑",
civilization: "グルーヴ",
type: "イベント",
rarity: "U",
text: "カードを1枚引き、自分のユニットを1体起こす。",
image: "",
variants: [
{ label: "U", image: "" }
]
}
];
let cards = [];
let mainDeck = [];
let subDeck = [];
let detailState = { cardId: null, zone: "main", copyIdx: 0 };
const catalogGrid = document.getElementById("catalogGrid");
const deckGrid50 = document.getElementById("deckGrid50");
const subDeckChips = document.getElementById("subDeckChips");
const pillMainCount = document.getElementById("pillMainCount");
const pillSubCount = document.getElementById("pillSubCount");
const subDeckCountText = document.getElementById("subDeckCountText");
const pillCardSource = document.getElementById("pillCardSource");
const searchInput = document.getElementById("searchInput");
const filterColor = document.getElementById("filterColor");
const filterCiv = document.getElementById("filterCiv");
const filterType = document.getElementById("filterType");
const filterRarity = document.getElementById("filterRarity");
const sortSelect = document.getElementById("sortSelect");
const deckNameInput = document.getElementById("deckNameInput");
const savedDeckSelect = document.getElementById("savedDeckSelect");
const recipeTextarea = document.getElementById("recipeTextarea");
const toastBar = document.getElementById("toastBar");
let toastTimer = null;
function showToast(msg) {
toastBar.textContent = msg;
toastBar.classList.add("show");
clearTimeout(toastTimer);
toastTimer = setTimeout(function () {
toastBar.classList.remove("show");
}, 1800);
}
function normalizeCard(raw, idx) {
const baseRarity = String(raw.rarity || "C");
const rawVariants = Array.isArray(raw.variants) && raw.variants.length > 0
? raw.variants.map(function (v, vIdx) {
if (typeof v === "string") {
return { label: v, image: String(raw.image || raw.imageUrl || "") };
}
return {
label: String(v.label || v.rarity || (vIdx === 0 ? baseRarity : baseRarity + "#" + (vIdx + 1))),
image: String(v.image || v.imageUrl || raw.image || raw.imageUrl || "")
};
})
: [{ label: baseRarity, image: String(raw.image || raw.imageUrl || "") }];
return {
id: String(raw.id || raw.code || ("card-" + idx)),
code: String(raw.code || raw.cardNumber || raw.id || ("C-" + idx)),
name: String(raw.name || "名称未設定"),
cost: Number.isFinite(Number(raw.cost)) ? Number(raw.cost) : 0,
color: String(raw.color || "無色"),
civilization: String(raw.civilization || raw.civ || ""),
type: String(raw.type || raw.cardType || ""),
rarity: baseRarity,
text: String(raw.text || raw.effect || ""),
image: String(raw.image || raw.imageUrl || ""),
variants: rawVariants
};
}
function findCard(cardId) {
return cards.find(function (c) { return c.id === cardId; });
}
function getVariantImage(card, rarityLabel) {
if (!card) return "";
const found = card.variants.find(function (v) { return v.label === rarityLabel; });
return (found && found.image) || card.image || "";
}
function populateFilters() {
const fill = function (sel, vals, allLabel) {
const prev = sel.value;
sel.innerHTML = '<option value="">' + allLabel + "</option>";
Array.from(vals).filter(Boolean).sort().forEach(function (v) {
const opt = document.createElement("option");
opt.value = v;
opt.textContent = v;
sel.appendChild(opt);
});
if (prev) sel.value = prev;
};
fill(filterColor, new Set(cards.map(function (c) { return c.color; })), "全色");
fill(filterCiv, new Set(cards.map(function (c) { return c.civilization; })), "全文明");
fill(filterType, new Set(cards.map(function (c) { return c.type; })), "全種類");
fill(filterRarity, new Set(cards.map(function (c) { return c.rarity; })), "全レア");
}
function getFilteredCards() {
const q = searchInput.value.trim().toLowerCase();
const col = filterColor.value;
const civ = filterCiv.value;
const tp = filterType.value;
const rar = filterRarity.value;
const srt = sortSelect.value;
const out = cards.filter(function (c) {
if (q && !(c.name + " " + c.code + " " + c.civilization).toLowerCase().includes(q)) return false;
if (col && c.color !== col) return false;
if (civ && c.civilization !== civ) return false;
if (tp && c.type !== tp) return false;
if (rar && c.rarity !== rar) return false;
return true;
});
out.sort(function (a, b) {
if (srt === "cost-asc") return a.cost - b.cost || a.code.localeCompare(b.code);
if (srt === "cost-desc") return b.cost - a.cost || a.code.localeCompare(b.code);
if (srt === "name") return a.name.localeCompare(b.name, "ja");
return a.code.localeCompare(b.code, "ja");
});
return out;
}
function mainCountOf(cardId) {
return mainDeck.filter(function (e) { return e.cardId === cardId; }).length;
}
function addToMain(card, rarityLabel) {
if (mainDeck.length >= 50) {
showToast("メインデッキは最大50枚です");
return;
}
if (mainCountOf(card.id) >= 4) {
showToast("同名カードは最大4枚までです");
return;
}
mainDeck.push({
uid: "m-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
cardId: card.id,
rarityLabel: rarityLabel || card.rarity
});
renderDeck();
showToast("追加: " + card.name);
}
function addToSub(card, rarityLabel) {
if (subDeck.length >= 10) {
showToast("サブ枠は最大10枚です");
return;
}
subDeck.push({
uid: "s-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
cardId: card.id,
rarityLabel: rarityLabel || card.rarity
});
renderDeck();
showToast("サブ追加: " + card.name);
}
function removeOneFromZone(zone, index) {
if (zone === "main") {
if (index >= 0 && index < mainDeck.length) {
const removed = mainDeck.splice(index, 1)[0];
const c = findCard(removed.cardId);
renderDeck();
showToast("削除: " + (c ? c.name : ""));
}
} else {
if (index >= 0 && index < subDeck.length) {
const removed = subDeck.splice(index, 1)[0];
const c = findCard(removed.cardId);
renderDeck();
showToast("サブ削除: " + (c ? c.name : ""));
}
}
}
function attachGestureHandlers(el, opts) {
let startX = 0;
let startY = 0;
let longPressTimer = null;
let triggeredLongPress = false;
let swiped = false;
const clearLP = function () {
clearTimeout(longPressTimer);
};
el.addEventListener("pointerdown", function (e) {
if (e.button !== undefined && e.button !== 0) return;
startX = e.clientX;
startY = e.clientY;
triggeredLongPress = false;
swiped = false;
clearLP();
longPressTimer = setTimeout(function () {
triggeredLongPress = true;
if (opts.onLongPress) opts.onLongPress();
}, 460);
});
el.addEventListener("pointermove", function (e) {
const dx = e.clientX - startX;
const dy = e.clientY - startY;
if (Math.hypot(dx, dy) > 14) {
clearLP();
}
if (!swiped && opts.onSwipeUp && dy < -38 && Math.abs(dy) > Math.abs(dx)) {
swiped = true;
opts.onSwipeUp();
}
if (!swiped && opts.onSwipeDown && dy > 38 && Math.abs(dy) > Math.abs(dx)) {
swiped = true;
opts.onSwipeDown();
}
});
el.addEventListener("pointerup", function () {
clearLP();
if (triggeredLongPress || swiped) return;
if (opts.onTap) opts.onTap();
});
el.addEventListener("pointercancel", clearLP);

});

function renderCatalog() {
const list = getFilteredCards();
catalogGrid.innerHTML = "";
list.forEach(function (card) {
const item = document.createElement("div");
item.className = "catalog-card";
const imgSrc = getVariantImage(card, card.rarity);
if (imgSrc) {
const img = document.createElement("img");
img.className = "card-img";
img.src = imgSrc;
img.alt = card.name;
item.appendChild(img);
} else {
const ph = document.createElement("div");
ph.className = "card-ph";
ph.textContent = card.code + "\n" + card.rarity;
item.appendChild(ph);
}
const title = document.createElement("div");
title.className = "card-title";
title.textContent = card.name;
item.appendChild(title);
const meta = document.createElement("div");
meta.className = "card-meta";
meta.innerHTML = "<span>C:" + card.cost + " / " + card.rarity + "</span><span>" + card.color + "</span>";
item.appendChild(meta);
attachGestureHandlers(item, {
onTap: function () { addToMain(card, card.rarity); },
onSwipeUp: function () { addToMain(card, card.rarity); },
onLongPress: function () { openDetailModal(card.id, "main", 0); }
});
catalogGrid.appendChild(item);
});
}
function renderDeck() {

pillSubCount.textContent = "サブ: " + subDeck.length + " / 10";

deckGrid50.innerHTML = "";
for (let i = 0; i < 50; i++) {
const slot = document.createElement("div");
const entry = mainDeck[i];
if (!entry) {
slot.className = "deck-slot";
slot.innerHTML = '<div class="deck-slot-inner"><span class="deck-slot-sub">' + (i + 1) + '</span></div>';
deckGrid50.appendChild(slot);
continue;
}
const card = findCard(entry.cardId);
slot.className = "deck-slot filled";
const imgSrc = getVariantImage(card, entry.rarityLabel);
if (imgSrc) {
const bgImg = document.createElement("img");
bgImg.src = imgSrc;
bgImg.alt = "";
slot.appendChild(bgImg);
}
const inner = document.createElement("div");
inner.className = "deck-slot-inner";
inner.innerHTML =
'<span class="deck-slot-name">' + (card ? card.name : "") + "</span>" +
'<span class="deck-slot-sub">' + entry.rarityLabel + "</span>";
slot.appendChild(inner);
(function (idx, cId) {
attachGestureHandlers(slot, {
onTap: function () { removeOneFromZone("main", idx); },
onSwipeDown: function () { removeOneFromZone("main", idx); },
onLongPress: function () {
const sameIndices = mainDeck
.map(function (e, k) { return e.cardId === cId ? k : -1; })
.filter(function (k) { return k >= 0; });
const copyPos = Math.max(0, sameIndices.indexOf(idx));
openDetailModal(cId, "main", copyPos);
}
});
})(i, entry.cardId);
deckGrid50.appendChild(slot);
}
subDeckChips.innerHTML = "";
subDeck.forEach(function (entry, idx) {

chip.type = "button";
chip.className = "sub-chip";

});
subDeckChips.appendChild(chip);
});
}
const detailOverlay = document.getElementById("detailOverlay");
const detailTitle = document.getElementById("detailTitle");
const detailImg = document.getElementById("detailImg");
const detailMeta = document.getElementById("detailMeta");
const detailText = document.getElementById("detailText");
const copyTabsWrap = document.getElementById("copyTabsWrap");
const copyTabsRow = document.getElementById("copyTabsRow");
const variantButtonsRow = document.getElementById("variantButtonsRow");
function openDetailModal(cardId, zone, copyIdx) {
const card = findCard(cardId);
if (!card) return;
detailState = { cardId: cardId, zone: zone || "main", copyIdx: copyIdx || 0 };
const targetList = detailState.zone === "sub" ? subDeck : mainDeck;
const matchingEntries = targetList.filter(function (e) { return e.cardId === cardId; });
if (matchingEntries.length > 0) {
copyTabsWrap.style.display = "flex";
copyTabsRow.innerHTML = "";
matchingEntries.forEach(function (ent, idx) {
const tab = document.createElement("button");
tab.type = "button";
tab.className = "btn" + (idx === detailState.copyIdx ? " active" : "");
tab.textContent = (idx + 1) + "枚目 (" + ent.rarityLabel + ")";
tab.addEventListener("click", function () {
openDetailModal(cardId, detailState.zone, idx);
});
copyTabsRow.appendChild(tab);
});
} else {
copyTabsWrap.style.display = "none";
}
const activeEntry = matchingEntries[detailState.copyIdx] || matchingEntries[0];
const currentRarity = activeEntry ? activeEntry.rarityLabel : card.rarity;
detailTitle.textContent = card.name + " [" + card.code + "]";
detailMeta.textContent =
"レア: " + currentRarity +
" / 色: " + card.color +
(card.civilization ? " / 文明: " + card.civilization : "") +
" / コスト: " + card.cost;
detailText.textContent = card.text || "";
const imgUrl = getVariantImage(card, currentRarity);
if (imgUrl) {
detailImg.src = imgUrl;
detailImg.style.display = "block";
} else {
detailImg.style.display = "none";
}
variantButtonsRow.innerHTML = "";
card.variants.forEach(function (v) {
const vBtn = document.createElement("button");
vBtn.type = "button";
vBtn.className = "btn" + (v.label === currentRarity ? " active" : "");
vBtn.textContent = v.label;
vBtn.addEventListener("click", function () {
if (activeEntry) {
activeEntry.rarityLabel = v.label;
renderDeck();
}
openDetailModal(cardId, detailState.zone, detailState.copyIdx);
});
variantButtonsRow.appendChild(vBtn);
});
document.getElementById("btnDetailAddMain").onclick = function () {
addToMain(card, currentRarity);
openDetailModal(cardId, "main", 0);
};
document.getElementById("btnDetailAddSub").onclick = function () {
addToSub(card, currentRarity);
openDetailModal(cardId, "sub", 0);
};
document.getElementById("btnDetailRemoveOne").onclick = function () {
const idxInZone = targetList.findIndex(function (e) { return e.cardId === cardId; });
if (idxInZone >= 0) {
removeOneFromZone(detailState.zone, idxInZone);
openDetailModal(cardId, detailState.zone, 0);
}
};
detailOverlay.classList.add("open");
}
document.getElementById("btnCloseDetail").addEventListener("click", function () {
detailOverlay.classList.remove("open");
});

function restoreFromQueryIfAny() {
const q = new URLSearchParams(window.location.search).get("deck");
if (!q) return;
try {
const parsed = JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(q)))));
if (parsed.name) deckNameInput.value = parsed.name;
if (Array.isArray(parsed.main)) {
mainDeck = parsed.main.slice(0, 50).map(function (pair, idx) {
const cid = Array.isArray(pair) ? pair[0] : pair;
const rar = Array.isArray(pair) ? pair[1] : "C";
return { uid: "q-" + idx, cardId: cid, rarityLabel: rar || "C" };
});
}
} catch {
// 無視
}
