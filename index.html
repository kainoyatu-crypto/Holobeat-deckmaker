<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HORO BEAT STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
--bg: #f4f4f6;
--paper: #ffffff;
--sub: #ececef;
--ink: #111114;
--muted: #666670;
--line: #222429;
--soft-line: #dfe1e7;
--accent: #111114;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
html, body {
min-height: 100dvh;
background-color: var(--bg);
color: var(--ink);
font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
}
.top-wrap {
min-height: 100dvh;
display: flex;
align-items: center;
justify-content: center;
padding: 18px 14px;
}
/* 手書きラフの縦長フレームをイメージ */
.top-frame {
width: 100%;
max-width: 390px;
min-height: min(640px, calc(100dvh - 36px));
background: var(--paper);
border: 1.5px solid var(--line);
border-radius: 6px;
padding: 20px 18px 24px;
display: flex;
flex-direction: column;
gap: 18px;
box-shadow: 4px 4px 0 var(--line);
}
.site-title-box {
border-bottom: 1.5px solid var(--line);
padding-bottom: 12px;
text-align: center;
}
.site-title {
font-family: "Playfair Display", Georgia, serif;
font-size: 1.35rem;
font-weight: 700;
letter-spacing: 0.08em;
color: var(--ink);
line-height: 1.25;
}
.nav-stack {
display: flex;
flex-direction: column;
gap: 14px;
margin-top: 4px;
}
.menu-box {
display: flex;
align-items: center;
justify-content: center;
text-align: center;
text-decoration: none;
color: var(--ink);
background: var(--paper);
border: 1.5px solid var(--line);
border-radius: 5px;
padding: 16px 14px;
font-size: 1.02rem;
font-weight: 700;
letter-spacing: 0.06em;
box-shadow: 2.5px 2.5px 0 var(--line);
transition: transform 0.08s ease, background-color 0.14s ease, color 0.14s ease;
cursor: pointer;
}
.menu-box:hover {
background: var(--accent);
color: var(--paper);
}
.menu-box:active {
transform: translate(1.5px, 1.5px);
box-shadow: 1px 1px 0 var(--line);
}
.frame-spacer {
flex: 1;
}
.frame-note {
font-size: 0.68rem;
color: var(--muted);
text-align: center;
line-height: 1.5;
border-top: 1px dashed var(--soft-line);
padding-top: 10px;
}
.toast-bar {
position: fixed;
bottom: 14px;
left: 50%;
transform: translateX(-50%);
background: var(--accent);
color: var(--paper);
padding: 7px 14px;
border-radius: 999px;
font-size: 0.76rem;
font-weight: 700;
z-index: 80;
opacity: 0;
pointer-events: none;
transition: opacity 0.16s ease;
}
.toast-bar.show {
opacity: 1;
}
</style>
</head>
<body>
<main class="top-wrap">
<section class="top-frame" aria-label="HORO BEAT STUDIO トップ">
<header class="site-title-box">
<h1 class="site-title">HORO BEAT STUDIO</h1>
</header>

<nav class="nav-stack" aria-label="メインメニュー">
<!-- デッキ作成ページのファイル名に合わせて href を変更してください -->
<a href="./deck.html" class="menu-box" id="linkDeckBuilder">
デッキ作成
</a>

<!-- 入賞リストページのファイル名に合わせて href を変更してください -->
<a href="./results.html" class="menu-box" id="linkResults">
入賞リスト確認
</a>
</nav>

<div class="frame-spacer"></div>

<footer class="frame-note">
非公式ファンメイド支援ツール
</footer>
</section>
</main>

<div class="toast-bar" id="toastBar"></div>

<script>
(function () {
const toastBar = document.getElementById("toastBar");
let toastTimer = null;
function showToast(msg) {
toastBar.textContent = msg;
toastBar.classList.add("show");
clearTimeout(toastTimer);
toastTimer = setTimeout(function () {
toastBar.classList.remove("show");
}, 1800);
}

// もしリンク先ファイルがまだ用意されていない場合でも画面が真っ白にならないよう案内を出す補助
document.getElementById("linkDeckBuilder").addEventListener("click", function () {
showToast("デッキ作成画面へ移動します...");
});
document.getElementById("linkResults").addEventListener("click", function () {
showToast("入賞リスト確認画面へ移動します...");
});
})();
</script>
</body>
</html>
