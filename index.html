<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HOROBEAT STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f4f6;
    --surface: #ffffff;
    --surface-2: #ececef;
    --border: rgba(15, 15, 18, 0.14);
    --text: #111114;
    --muted: #666670;
    --accent: #111114;
    --accent-text: #ffffff;
    --danger: #dc2626;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .brand-logo {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--text);
    text-transform: uppercase;
    user-select: none;
  }

  .header-actions {
    display: flex;
    gap: 8px;
  }

  button {
    font-family: inherit;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  button:hover {
    background: #e2e2e7;
  }

  button:active {
    transform: scale(0.98);
  }

  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: 700;
  }

  button.primary:hover {
    background: #27272c;
  }

  button.danger {
    border-color: rgba(220, 38, 38, 0.45);
    color: var(--danger);
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    gap: 20px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }

  .deck-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .deck-count {
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.06em;
  }

  .deck-grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 6px;
  }

  @media (max-width: 720px) {
    .deck-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
  }

  .deck-slot {
    position: relative;
    aspect-ratio: 5 / 7;
    background: var(--surface-2);
    border: 1px dashed rgba(17, 17, 20, 0.18);
    border-radius: 6px;
    overflow: hidden;
    touch-action: pan-x;
  }

  .deck-slot.filled {
    border: 1px solid rgba(17, 17, 20, 0.24);
    cursor: pointer;
  }

  .deck-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .rarity-badge {
    position: absolute;
    left: 4px;
    bottom: 4px;
    background: rgba(17, 17, 20, 0.85);
    color: #ffffff;
    border-radius: 4px;
    padding: 1px 4px;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    pointer-events: none;
  }

  .controls-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .search-input {
    flex: 1 1 200px;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
  }

  .catalog-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
    gap: 10px;
  }

  .catalog-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    cursor: pointer;
  }

  .catalog-card img {
    width: 100%;
    aspect-ratio: 5 / 7;
    object-fit: cover;
    display: block;
    background: #e2e2e7;
  }

  .catalog-meta {
    padding: 6px;
    font-size: 0.72rem;
  }

  .catalog-name {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .catalog-sub {
    color: var(--muted);
    font-size: 0.66rem;
    margin-top: 2px;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(17, 17, 20, 0.56);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-box {
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
  }

  .modal-title {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
  }

  .detail-preview {
    width: 180px;
    aspect-ratio: 5 / 7;
    margin: 0 auto 14px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-2);
  }

  .detail-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .copy-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .copy-tab.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .variant-strip {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 8px;
    margin-bottom: 14px;
  }

  .variant-item {
    background: var(--surface-2);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 4px;
    cursor: pointer;
    text-align: center;
  }

  .variant-item.selected {
    border-color: var(--accent);
  }

  .variant-item img {
    width: 100%;
    aspect-ratio: 5 / 7;
    object-fit: cover;
    border-radius: 4px;
    display: block;
  }

  .variant-label {
    font-size: 0.68rem;
    margin-top: 4px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .toast-msg {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 90;
    background: #111114;
    color: #ffffff;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    display: none;
  }

  .toast-msg.show {
    display: block;
  }
</style>
</head>
<body>
  <header class="app-header">
    <div class="brand-logo">HOROBEAT STUDIO</div>
    <div class="header-actions">
      <button id="btnExportModal" class="primary" type="button">出力・画像</button>
      <button id="btnOpenClear" class="danger" type="button">クリア</button>
    </div>
  </header>

  <main class="container">
    <section class="panel">
      <div class="deck-top">
        <div class="deck-count" id="deckCountLabel">DECK 0 / 50</div>
        <div style="font-size:0.75rem;color:var(--muted);">タップで詳細・枚数別レアリティ選択 / 下スワイプで1枚削除</div>
      </div>
      <div class="deck-grid" id="deckGrid"></div>
    </section>

    <section class="panel">
      <div class="controls-bar">
        <input id="searchInput" class="search-input" type="search" placeholder="カード名・型番・レアリティで検索" />
        <span id="catalogCountLabel" style="align-self:center;font-size:0.82rem;color:var(--muted);">0件</span>
      </div>
      <div class="catalog-grid" id="catalogGrid"></div>
    </section>
  </main>

  <div class="modal-backdrop" id="detailModal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2 class="modal-title" id="detailTitle">カード詳細</h2>
        <button type="button" id="closeDetailModal">閉じる</button>
      </div>
      <div class="detail-preview">
        <img id="detailPreviewImg" alt="" />
      </div>
      <div id="detailMeta" style="font-size:0.8rem;color:var(--muted);margin-bottom:12px;"></div>

      <div id="copySelectorWrap" style="display:none;">
        <div style="font-size:0.8rem;font-weight:700;margin-bottom:6px;">デッキ内の各枚数ごとのレアリティ選択</div>
        <div class="copy-tabs" id="copyTabs"></div>
      </div>

      <div style="font-size:0.8rem;font-weight:700;margin-bottom:6px;">レアリティ / イラスト候補</div>
      <div class="variant-strip" id="variantStrip"></div>

      <div class="modal-footer">
        <button type="button" id="btnRemoveOneCopy" class="danger">1枚減らす</button>
        <button type="button" id="btnAddOneCopy" class="primary">1枚追加</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="clearModal" aria-hidden="true">
    <div class="modal-box" style="max-width:380px;">
      <div class="modal-head">
        <h2 class="modal-title">デッキをクリアしますか？</h2>
      </div>
      <p style="margin:0 0 14px;font-size:0.86rem;color:var(--muted);">現在のデッキ内のカードがすべて外れます。</p>
      <div class="modal-footer">
        <button type="button" id="btnCancelClear">キャンセル</button>
        <button type="button" id="btnConfirmClear" class="danger">クリアする</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="exportModal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2 class="modal-title">デッキ出力・画像生成</h2>
        <button type="button" id="closeExportModal">閉じる</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
        <button type="button" id="btnGenerateDeckImage" class="primary">デッキ画像を生成 (PNG)</button>
        <button type="button" id="btnCopyDeckText">テキストをコピー</button>
      </div>
      <textarea id="deckTextOutput" rows="8" readonly style="width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:0.8rem;"></textarea>
      <div id="generatedImageWrap" style="margin-top:12px;"></div>
    </div>
  </div>

  <div class="toast-msg" id="toastMsg"></div>

  <script>
    const MAX_DECK_SIZE = 50;
    const STORAGE_KEY = "horobeat_studio_deck_v1";

    let allCards = [];
    let variantGroups = new Map();
    let deckSlots = [];
    let activeDetailKey = null;
    let activeCopyIndex = 0;

    const toastEl = document.getElementById("toastMsg");
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2200);
    }

    function normalizeCardsPayload(raw) {
      if (Array.isArray(raw)) return raw;
      if (raw && typeof raw === "object") {
        if (Array.isArray(raw.cards)) return raw.cards;
        if (Array.isArray(raw.items)) return raw.items;
        if (Array.isArray(raw.data)) return raw.data;
        const values = Object.values(raw);
        if (values.length > 0 && values.every((v) => v && typeof v === "object" && !Array.isArray(v))) {
          return values;
        }
      }
      return [];
    }

    async function fetchCardsWithFallback() {
      const candidateUrls = [
        "./data/cards.json",
        "data/cards.json",
        "../data/cards.json",
        "./cards.json",
      ];
      let lastError = null;
      for (const url of candidateUrls) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) {
            lastError = new Error(`${url} -> HTTP ${res.status}`);
            continue;
          }
          const json = await res.json();
          const list = normalizeCardsPayload(json);
          if (list.length > 0) {
            return { cards: list, sourceUrl: url, error: null };
          }
          lastError = new Error(`${url} -> 0件`);
        } catch (err) {
          lastError = new Error(`${url} -> ${String(err && err.message || err)}`);
        }
      }
      return {
        cards: [],
        sourceUrl: null,
        error: lastError ? lastError.message : "カードデータを読み込めませんでした",
      };
    }

    function getBaseCardKey(card) {
      const no = String(card.cardNumber || card.card_no || card.number || "").trim();
      if (no) return `NO:${no.toUpperCase()}`;
      const id = String(card.id || card.cardId || "").trim();
      const stripped = id.replace(/(_[A-Z0-9]+)?(__\d+)?$/i, "");
      if (stripped) return `ID:${stripped.toUpperCase()}`;
      return `NAME:${String(card.name || card.title || "").trim()}`;
    }

    function getVariantKey(card) {
      const id = String(card.id || card.cardId || "").trim();
      const rarity = String(card.rarity || "").trim();
      const img = String(card.imageUrl || card.image || card.img || card.src || "").trim();
      return id || `${getBaseCardKey(card)}::${rarity}::${img}`;
    }

    function buildVariantGroups(cards) {
      const groups = new Map();
      for (const c of cards) {
        if (!c || typeof c !== "object") continue;
        const baseKey = getBaseCardKey(c);
        const vKey = getVariantKey(c);
        const imageUrl = String(c.imageUrl || c.image || c.img || c.src || "").trim();
        const entry = {
          variantKey: vKey,
          baseKey,
          cardId: String(c.id || c.cardId || ""),
          cardNumber: String(c.cardNumber || c.card_no || c.number || c.id || ""),
          name: String(c.name || c.title || "名称未設定"),
          rarity: String(c.rarity || "STD"),
          imageUrl,
          raw: c,
        };
        if (!groups.has(baseKey)) {
          groups.set(baseKey, []);
        }
        const list = groups.get(baseKey);
        if (!list.some((item) => item.variantKey === vKey)) {
          list.push(entry);
        }
      }
      return groups;
    }

    function findEntryByVariantKey(variantKey) {
      for (const list of variantGroups.values()) {
        const hit = list.find((item) => item.variantKey === variantKey);
        if (hit) return hit;
      }
      return null;
    }

    function saveDeckToStorage() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(deckSlots.map((s) => s.variantKey)));
      } catch (_) {}
    }

    function loadDeckFromStorage() {
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        if (!Array.isArray(raw)) return;
        deckSlots = raw
          .slice(0, MAX_DECK_SIZE)
          .map((vk) => findEntryByVariantKey(vk))
          .filter(Boolean)
          .map((e) => ({ ...e }));
      } catch (_) {
        deckSlots = [];
      }
    }

    function addCardToDeck(entry) {
      if (!entry) return;
      if (deckSlots.length >= MAX_DECK_SIZE) {
        showToast(`デッキ上限（${MAX_DECK_SIZE}枚）です`);
        return;
      }
      deckSlots.push({ ...entry });
      saveDeckToStorage();
      renderDeck();
      showToast(`${entry.name}（${entry.rarity}）を追加しました`);
    }

    function removeDeckSlotAt(index) {
      if (index < 0 || index >= deckSlots.length) return;
      const removed = deckSlots.splice(index, 1)[0];
      saveDeckToStorage();
      renderDeck();
      if (removed) {
        showToast(`${removed.name} を1枚外しました`);
      }
    }

    function renderDeck() {
      const grid = document.getElementById("deckGrid");
      document.getElementById("deckCountLabel").textContent = `DECK ${deckSlots.length} / ${MAX_DECK_SIZE}`;
      grid.innerHTML = "";

      for (let i = 0; i < MAX_DECK_SIZE; i++) {
        const slotEl = document.createElement("div");
        slotEl.className = "deck-slot";

        const item = deckSlots[i];
        if (item) {
          slotEl.classList.add("filled");

          const img = document.createElement("img");
          img.src = item.imageUrl || "";
          img.alt = item.name;
          img.loading = "lazy";
          slotEl.appendChild(img);

          const badge = document.createElement("span");
          badge.className = "rarity-badge";
          badge.textContent = item.rarity || "STD";
          slotEl.appendChild(badge);

          let startY = null;
          let swipedDown = false;

          slotEl.addEventListener("pointerdown", (e) => {
            startY = e.clientY;
            swipedDown = false;
          });

          slotEl.addEventListener("pointermove", (e) => {
            if (startY === null) return;
            if (e.clientY - startY > 36) {
              swipedDown = true;
            }
          });

          slotEl.addEventListener("pointerup", () => {
            if (swipedDown) {
              removeDeckSlotAt(i);
            } else if (startY !== null) {
              openDetailModal(item.baseKey, item.variantKey);
            }
            startY = null;
            swipedDown = false;
          });
        }

        grid.appendChild(slotEl);
      }
    }

    function renderCatalog(loadErrorMsg = "") {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const grid = document.getElementById("catalogGrid");
      grid.innerHTML = "";

      const entries = [];
      for (const list of variantGroups.values()) {
        const primary = list[0];
        if (!primary) continue;
        const allRarities = list.map((x) => x.rarity).join(" ");
        const hay = `${primary.name} ${primary.cardNumber} ${primary.cardId} ${allRarities}`.toLowerCase();
        if (!q || hay.includes(q)) {
          entries.push({ primary, variants: list });
        }
      }

      document.getElementById("catalogCountLabel").textContent = `${entries.length}種（全${allCards.length}件）`;

      if (entries.length === 0) {
        const notice = document.createElement("div");
        notice.style.gridColumn = "1 / -1";
        notice.style.padding = "16px";
        notice.style.borderRadius = "8px";
        notice.style.background = "var(--surface-2)";
        notice.style.fontSize = "0.82rem";
        notice.style.color = "var(--muted)";
        notice.textContent = loadErrorMsg
          ? `カードデータを読み込めませんでした（${loadErrorMsg}）。./data/cards.json の配置とJSON形式を確認してください。`
          : "該当するカードがありません。";
        grid.appendChild(notice);
        return;
      }

      for (const { primary, variants } of entries) {
        const cardEl = document.createElement("div");
        cardEl.className = "catalog-card";

        const img = document.createElement("img");
        img.src = primary.imageUrl || "";
        img.alt = primary.name;
        img.loading = "lazy";

        const meta = document.createElement("div");
        meta.className = "catalog-meta";

        const nameEl = document.createElement("div");
        nameEl.className = "catalog-name";
        nameEl.textContent = primary.name;

        const subEl = document.createElement("div");
        subEl.className = "catalog-sub";
        subEl.textContent = variants.length > 1
          ? `${primary.cardNumber || ""} · ${variants.length}種`
          : `${primary.cardNumber || ""} · ${primary.rarity}`;

        meta.appendChild(nameEl);
        meta.appendChild(subEl);
        cardEl.appendChild(img);
        cardEl.appendChild(meta);

        cardEl.addEventListener("click", () => {
          openDetailModal(primary.baseKey, primary.variantKey);
        });

        grid.appendChild(cardEl);
      }
    }

    function getDeckSlotIndicesForBaseKey(baseKey) {
      const indices = [];
      deckSlots.forEach((slot, idx) => {
        if (slot.baseKey === baseKey) indices.push(idx);
      });
      return indices;
    }

    function openDetailModal(baseKey, preferredVariantKey = null) {
      activeDetailKey = baseKey;
      const variants = variantGroups.get(baseKey) || [];
      if (!variants.length) return;

      const matchingDeckIndices = getDeckSlotIndicesForBaseKey(baseKey);
      if (matchingDeckIndices.length > 0) {
        activeCopyIndex = Math.min(activeCopyIndex, matchingDeckIndices.length - 1);
        if (activeCopyIndex < 0) activeCopyIndex = 0;
      } else {
        activeCopyIndex = 0;
      }

      const currentSlot = matchingDeckIndices.length > 0
        ? deckSlots[matchingDeckIndices[activeCopyIndex]]
        : null;

      const selectedVariant =
        variants.find((v) => v.variantKey === (currentSlot ? currentSlot.variantKey : preferredVariantKey)) ||
        variants[0];

      document.getElementById("detailTitle").textContent = selectedVariant.name;
      document.getElementById("detailPreviewImg").src = selectedVariant.imageUrl || "";
      document.getElementById("detailMeta").textContent =
        `型番: ${selectedVariant.cardNumber || "-"} / デッキ内枚数: ${matchingDeckIndices.length}枚`;

      const copyWrap = document.getElementById("copySelectorWrap");
      const copyTabs = document.getElementById("copyTabs");
      copyTabs.innerHTML = "";

      if (matchingDeckIndices.length > 0) {
        copyWrap.style.display = "block";
        matchingDeckIndices.forEach((slotIdx, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "copy-tab" + (i === activeCopyIndex ? " active" : "");
          btn.textContent = `${i + 1}枚目 (${deckSlots[slotIdx].rarity})`;
          btn.addEventListener("click", () => {
            activeCopyIndex = i;
            openDetailModal(baseKey, deckSlots[slotIdx].variantKey);
          });
          copyTabs.appendChild(btn);
        });
      } else {
        copyWrap.style.display = "none";
      }

      const strip = document.getElementById("variantStrip");
      strip.innerHTML = "";
      variants.forEach((v) => {
        const item = document.createElement("div");
        item.className = "variant-item" + (v.variantKey === selectedVariant.variantKey ? " selected" : "");

        const vImg = document.createElement("img");
        vImg.src = v.imageUrl || "";
        vImg.alt = v.rarity;

        const vLabel = document.createElement("div");
        vLabel.className = "variant-label";
        vLabel.textContent = v.rarity || "STD";

        item.appendChild(vImg);
        item.appendChild(vLabel);

        item.addEventListener("click", () => {
          document.getElementById("detailPreviewImg").src = v.imageUrl || "";
          if (matchingDeckIndices.length > 0) {
            const targetSlotIdx = matchingDeckIndices[activeCopyIndex];
            deckSlots[targetSlotIdx] = { ...v };
            saveDeckToStorage();
            renderDeck();
            showToast(`${activeCopyIndex + 1}枚目を ${v.rarity} に変更しました`);
          }
          openDetailModal(baseKey, v.variantKey);
        });

        strip.appendChild(item);
      });

      document.getElementById("btnAddOneCopy").onclick = () => {
        addCardToDeck(selectedVariant);
        const updatedIndices = getDeckSlotIndicesForBaseKey(baseKey);
        activeCopyIndex = Math.max(0, updatedIndices.length - 1);
        openDetailModal(baseKey, selectedVariant.variantKey);
      };

      document.getElementById("btnRemoveOneCopy").onclick = () => {
        const updatedIndices = getDeckSlotIndicesForBaseKey(baseKey);
        if (!updatedIndices.length) return;
        const targetIdx = updatedIndices[Math.min(activeCopyIndex, updatedIndices.length - 1)];
        removeDeckSlotAt(targetIdx);
        openDetailModal(baseKey, selectedVariant.variantKey);
      };

      const modal = document.getElementById("detailModal");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeDetailModal() {
      const modal = document.getElementById("detailModal");
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeDetailModal").addEventListener("click", closeDetailModal);
    document.getElementById("detailModal").addEventListener("click", (e) => {
      if (e.target.id === "detailModal") closeDetailModal();
    });

    const clearModal = document.getElementById("clearModal");
    document.getElementById("btnOpenClear").addEventListener("click", () => {
      clearModal.classList.add("open");
      clearModal.setAttribute("aria-hidden", "false");
    });
    document.getElementById("btnCancelClear").addEventListener("click", () => {
      clearModal.classList.remove("open");
      clearModal.setAttribute("aria-hidden", "true");
    });
    document.getElementById("btnConfirmClear").addEventListener("click", () => {
      deckSlots = [];
      saveDeckToStorage();
      renderDeck();
      clearModal.classList.remove("open");
      clearModal.setAttribute("aria-hidden", "true");
      showToast("デッキをクリアしました");
    });
    clearModal.addEventListener("click", (e) => {
      if (e.target.id === "clearModal") {
        clearModal.classList.remove("open");
        clearModal.setAttribute("aria-hidden", "true");
      }
    });

    const exportModal = document.getElementById("exportModal");
    function buildDeckText() {
      const map = new Map();
      for (const slot of deckSlots) {
        const key = `${slot.name}__${slot.rarity}`;
        if (!map.has(key)) {
          map.set(key, { name: slot.name, rarity: slot.rarity, cardNumber: slot.cardNumber, count: 0 });
        }
        map.get(key).count += 1;
      }
      const lines = [`【HOROBEAT DECK (${deckSlots.length}/${MAX_DECK_SIZE})】`];
      for (const item of map.values()) {
        lines.push(`${item.count} x ${item.name} [${item.rarity}] ${item.cardNumber ? `(${item.cardNumber})` : ""}`.trim());
      }
      return lines.join("\n");
    }

    document.getElementById("btnExportModal").addEventListener("click", () => {
      document.getElementById("deckTextOutput").value = buildDeckText();
      document.getElementById("generatedImageWrap").innerHTML = "";
      exportModal.classList.add("open");
      exportModal.setAttribute("aria-hidden", "false");
    });

    document.getElementById("closeExportModal").addEventListener("click", () => {
      exportModal.classList.remove("open");
      exportModal.setAttribute("aria-hidden", "true");
    });

    document.getElementById("btnCopyDeckText").addEventListener("click", async () => {
      const txt = document.getElementById("deckTextOutput").value;
      try {
        await navigator.clipboard.writeText(txt);
        showToast("デッキテキストをコピーしました");
      } catch (_) {
        showToast("コピーに失敗しました");
      }
    });

    async function loadImageSafe(url) {
      if (!url) return null;
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        const timer = setTimeout(() => resolve(null), 6000);
        img.onload = () => {
          clearTimeout(timer);
          resolve(img);
        };
        img.onerror = () => {
          clearTimeout(timer);
          resolve(null);
        };
        img.src = url;
      });
    }

    document.getElementById("btnGenerateDeckImage").addEventListener("click", async () => {
      if (!deckSlots.length) {
        showToast("デッキにカードがありません");
        return;
      }
      const wrap = document.getElementById("generatedImageWrap");
      wrap.innerHTML = `<div style="font-size:0.82rem;color:var(--muted);">画像を生成中...</div>`;

      try {
        const cols = 10;
        const rows = Math.max(1, Math.ceil(deckSlots.length / cols));
        const cardW = 140;
        const cardH = 196;
        const gap = 10;
        const pad = 20;
        const headerH = 44;

        const canvas = document.createElement("canvas");
        canvas.width = pad * 2 + cols * cardW + (cols - 1) * gap;
        canvas.height = pad * 2 + headerH + rows * cardH + (rows - 1) * gap;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f4f4f6";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#111114";
        ctx.font = "700 22px 'Playfair Display', Georgia, serif";
        ctx.fillText(`HOROBEAT STUDIO  (${deckSlots.length}/${MAX_DECK_SIZE})`, pad, pad + 24);

        const images = await Promise.all(deckSlots.map((slot) => loadImageSafe(slot.imageUrl)));

        deckSlots.forEach((slot, idx) => {
          const col = idx % cols;
          const row = Math.floor(idx / cols);
          const x = pad + col * (cardW + gap);
          const y = pad + headerH + row * (cardH + gap);

          ctx.fillStyle = "#e2e2e7";
          ctx.fillRect(x, y, cardW, cardH);

          const img = images[idx];
          if (img) {
            try {
              ctx.drawImage(img, x, y, cardW, cardH);
            } catch (_) {
              ctx.fillStyle = "#52525b";
              ctx.font = "12px sans-serif";
              ctx.fillText(slot.name.slice(0, 10), x + 8, y + 24);
            }
          } else {
            ctx.fillStyle = "#52525b";
            ctx.font = "12px sans-serif";
            ctx.fillText(slot.name.slice(0, 10), x + 8, y + 24);
          }

          ctx.fillStyle = "rgba(17, 17, 20, 0.85)";
          ctx.fillRect(x + 6, y + cardH - 24, 46, 18);
          ctx.fillStyle = "#ffffff";
          ctx.font = "700 11px sans-serif";
          ctx.fillText(slot.rarity || "STD", x + 11, y + cardH - 11);
        });

        const dataUrl = canvas.toDataURL("image/png");
        wrap.innerHTML = "";
        const outImg = document.createElement("img");
        outImg.src = dataUrl;
        outImg.alt = "生成されたデッキ画像";
        outImg.style.width = "100%";
        outImg.style.borderRadius = "8px";
        outImg.style.border = "1px solid var(--border)";
        wrap.appendChild(outImg);
        showToast("デッキ画像を生成しました");
      } catch (err) {
        wrap.innerHTML = `<div style="font-size:0.82rem;color:#dc2626;">画像生成エラー: ${String(err && err.message || err)}</div>`;
      }
    });

    document.getElementById("searchInput").addEventListener("input", () => renderCatalog());

    async function initApp() {
      const result = await fetchCardsWithFallback();
      allCards = result.cards;
      variantGroups = buildVariantGroups(allCards);
      loadDeckFromStorage();
      renderDeck();
      renderCatalog(result.error || "");
    }

    initApp();
  </script>
</body>
</html>
