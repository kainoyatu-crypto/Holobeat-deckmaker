<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HOROBEAT STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f4f4f6;
    --surface: #ffffff;
    --surface-2: #ececef;
    --border: rgba(15, 15, 18, 0.14);
    --text: #111114;
    --muted: #666670;
    --accent: #111114;
    --accent-text: #ffffff;
    --danger: #dc2626;
    --ok: #16a34a;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .brand-logo {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--text);
    text-transform: uppercase;
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  button {
    font-family: inherit;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  button:hover {
    background: #e2e2e7;
  }

  button:active {
    transform: scale(0.98);
  }

  button.primary {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: 700;
  }

  button.danger {
    background: #fef2f2;
    border-color: rgba(220, 38, 38, 0.35);
    color: var(--danger);
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 10px 12px 20px;
    display: grid;
    gap: 12px;
  }

  .zone-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .zone-tabs {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    gap: 2px;
  }

  .zone-tab {
    background: transparent;
    border: none;
    border-radius: 7px;
    padding: 6px 12px;
    color: var(--muted);
    font-weight: 700;
  }

  .zone-tab.active {
    background: var(--surface-2);
    color: var(--text);
  }

  .zone-count {
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
  }

  .zone-count .num {
    color: var(--ok);
    font-size: 1rem;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }

  .empty-guide {
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 20px 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    line-height: 1.75;
    background: #fafafa;
  }

  .deck-grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 6px;
  }

  @media (max-width: 720px) {
    .deck-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
  }

  .deck-slot {
    position: relative;
    aspect-ratio: 5 / 7;
    background: var(--surface-2);
    border: 1px solid rgba(17, 17, 20, 0.2);
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    touch-action: pan-x;
  }

  .deck-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .rarity-badge {
    position: absolute;
    left: 4px;
    bottom: 4px;
    background: rgba(17, 17, 20, 0.86);
    color: #ffffff;
    border-radius: 4px;
    padding: 1px 4px;
    font-size: 0.62rem;
    font-weight: 700;
    pointer-events: none;
  }

  .dock-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
  }

  .dock-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: thin;
  }

  .dock-card {
    flex: 0 0 96px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
  }

  .dock-card img {
    width: 100%;
    aspect-ratio: 5 / 7;
    object-fit: cover;
    display: block;
    background: #e2e2e7;
  }

  .dock-card-sub {
    padding: 4px 6px;
    font-size: 0.66rem;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .search-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .search-box {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0 10px;
    height: 40px;
    gap: 6px;
  }

  .search-box input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 0.9rem;
  }

  .icon-clear {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 2px 6px;
    font-size: 1rem;
  }

  .filter-btn {
    height: 40px;
    padding: 0 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-weight: 700;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(17, 17, 20, 0.56);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .modal-backdrop.open {
    display: flex;
  }

  .modal-box {
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }

  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
  }

  .modal-title {
    margin: 0;
    font-size: 1rem;
    font-weight: 700;
  }

  .detail-preview {
    width: 176px;
    aspect-ratio: 5 / 7;
    margin: 0 auto 12px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--surface-2);
  }

  .detail-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .copy-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .copy-tab.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .variant-strip {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(74px, 1fr));
    gap: 8px;
    margin-bottom: 12px;
  }

  .variant-item {
    background: var(--surface-2);
    border: 2px solid transparent;
    border-radius: 8px;
    padding: 4px;
    cursor: pointer;
    text-align: center;
  }

  .variant-item.selected {
    border-color: var(--accent);
  }

  .variant-item img {
    width: 100%;
    aspect-ratio: 5 / 7;
    object-fit: cover;
    border-radius: 4px;
    display: block;
  }

  .variant-label {
    font-size: 0.68rem;
    font-weight: 700;
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .chip.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .toast-msg {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 90;
    background: #111114;
    color: #ffffff;
    padding: 9px 16px;
    border-radius: 999px;
    font-size: 0.82rem;
    display: none;
  }

  .toast-msg.show {
    display: block;
  }
</style>
</head>
<body>
  <header class="app-header">
    <div class="brand-logo">HOROBEAT STUDIO</div>
    <div class="header-actions">
      <button type="button" id="btnSavedList">保存一覧</button>
      <button type="button" id="btnStats">分布</button>
      <button type="button" id="btnExport" class="primary">出力</button>
      <button type="button" id="btnOpenClear" class="danger">クリア</button>
    </div>
  </header>

  <main class="container">
    <div class="zone-bar">
      <div class="zone-tabs">
        <button type="button" class="zone-tab active" data-zone="main">メインデッキ</button>
        <button type="button" class="zone-tab" data-zone="sub">サブ / 調整枠</button>
      </div>
      <div class="zone-count" id="zoneCountLabel">
        MAIN <span class="num">0</span> / 50 枚
      </div>
    </div>

    <section class="panel" id="deckPanel">
      <div id="emptyGuide" class="empty-guide">
        下のカードをタップ（または上スワイプ）で追加（50枚基準）<br />
        デッキ内のカードをタップ（または下スワイプ）で削除・詳細
      </div>
      <div class="deck-grid" id="deckGrid" style="display:none;"></div>
    </section>

    <section class="panel">
      <div class="dock-header">
        <span>CARD DOCK（タップ・上スワイプで追加 / 長押しで詳細）</span>
        <span id="catalogCountLabel">0件</span>
      </div>
      <div class="dock-scroll" id="dockScroll"></div>
    </section>

    <div class="search-row">
      <div class="search-box">
        <span>🔍</span>
        <input type="search" id="searchInput" placeholder="カード名・型番で検索" />
        <button type="button" class="icon-clear" id="btnClearSearch" aria-label="検索クリア">×</button>
      </div>
      <button type="button" class="filter-btn" id="btnOpenFilter">絞り込み</button>
    </div>
  </main>

  <div class="modal-backdrop" id="detailModal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2 class="modal-title" id="detailTitle">カード詳細</h2>
        <button type="button" id="closeDetailModal">閉じる</button>
      </div>
      <div class="detail-preview">
        <img id="detailPreviewImg" alt="" />
      </div>
      <div id="detailMeta" style="font-size:0.8rem;color:var(--muted);margin-bottom:10px;"></div>

      <div id="copySelectorWrap" style="display:none;">
        <div style="font-size:0.8rem;font-weight:700;margin-bottom:6px;">デッキ内の各枚数ごとのレアリティ選択</div>
        <div class="copy-tabs" id="copyTabs"></div>
      </div>

      <div style="font-size:0.8rem;font-weight:700;margin-bottom:6px;">レアリティ / イラスト候補</div>
      <div class="variant-strip" id="variantStrip"></div>

      <div class="modal-footer">
        <button type="button" id="btnRemoveOneCopy" class="danger">1枚減らす</button>
        <button type="button" id="btnAddOneCopy" class="primary">1枚追加</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="filterModal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2 class="modal-title">絞り込み</h2>
        <button type="button" id="closeFilterModal">閉じる</button>
      </div>
      <div style="font-size:0.8rem;font-weight:700;margin-bottom:6px;">レアリティ</div>
      <div class="chip-row" id="rarityChips"></div>
      <div style="font-size:0.8rem;font-weight:700;margin-bottom:6px;">文明 / 色</div>
      <div class="chip-row" id="colorChips"></div>
      <div class="modal-footer">
        <button type="button" id="btnResetFilter">リセット</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="statsModal" aria-hidden="true">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-head">
        <h2 class="modal-title">デッキ分布</h2>
        <button type="button" id="closeStatsModal">閉じる</button>
      </div>
      <div id="statsBody" style="font-size:0.85rem;"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="savedModal" aria-hidden="true">
    <div class="modal-box" style="max-width:440px;">
      <div class="modal-head">
        <h2 class="modal-title">保存済みデッキ</h2>
        <button type="button" id="closeSavedModal">閉じる</button>
      </div>
      <div style="display:flex;gap:6px;margin-bottom:10px;">
        <input type="text" id="saveNameInput" placeholder="デッキ名を入力" style="flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:8px;" />
        <button type="button" id="btnSaveCurrent" class="primary">保存</button>
      </div>
      <div id="savedListBody" style="font-size:0.82rem;"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="exportModal" aria-hidden="true">
    <div class="modal-box">
      <div class="modal-head">
        <h2 class="modal-title">出力・画像生成</h2>
        <button type="button" id="closeExportModal">閉じる</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <button type="button" id="btnGenerateImage" class="primary">デッキ画像を生成 (PNG)</button>
        <button type="button" id="btnCopyText">テキストをコピー</button>
      </div>
      <textarea id="exportText" rows="8" readonly style="width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:0.8rem;"></textarea>
      <div id="generatedImgWrap" style="margin-top:12px;"></div>
    </div>
  </div>

  <div class="modal-backdrop" id="clearModal" aria-hidden="true">
    <div class="modal-box" style="max-width:380px;">
      <div class="modal-head">
        <h2 class="modal-title">デッキをクリアしますか？</h2>
      </div>
      <p style="margin:0 0 14px;font-size:0.86rem;color:var(--muted);">現在のゾーンのカードをすべて外します。</p>
      <div class="modal-footer">
        <button type="button" id="btnCancelClear">キャンセル</button>
        <button type="button" id="btnConfirmClear" class="danger">クリアする</button>
      </div>
    </div>
  </div>

  <div class="toast-msg" id="toastMsg"></div>

  <script>
    const MAX_MAIN = 50;
    const MAX_SUB = 10;
    const STORAGE_KEY = "horobeat_studio_zones_v1";
    const SAVED_KEY = "horobeat_studio_saved_v1";

    let allCards = [];
    let variantGroups = new Map();
    let currentZone = "main";
    let deckZones = { main: [], sub: [] };
    let selectedRarity = "ALL";
    let selectedColor = "ALL";
    let activeCopyIndex = 0;

    const toastEl = document.getElementById("toastMsg");
    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
    }

    function normalizeCardsPayload(raw) {
      if (Array.isArray(raw)) return raw;
      if (raw && typeof raw === "object") {
        if (Array.isArray(raw.cards)) return raw.cards;
        if (Array.isArray(raw.items)) return raw.items;
        if (Array.isArray(raw.data)) return raw.data;
        const vals = Object.values(raw);
        if (vals.length > 0 && vals.every((v) => v && typeof v === "object" && !Array.isArray(v))) {
          return vals;
        }
      }
      return [];
    }

    async function fetchCardsWithFallback() {
      const candidates = ["./data/cards.json", "data/cards.json", "../data/cards.json", "./cards.json"];
      let lastErr = "";
      for (const url of candidates) {
        try {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) {
            lastErr = `${url} (HTTP ${res.status})`;
            continue;
          }
          const json = await res.json();
          const list = normalizeCardsPayload(json);
          if (list.length > 0) return { cards: list, error: "" };
          lastErr = `${url} (0件)`;
        } catch (err) {
          lastErr = `${url} (${String(err && err.message || err)})`;
        }
      }
      return { cards: [], error: lastErr || "カードデータが見つかりません" };
    }

    function getBaseCardKey(card) {
      const no = String(card.cardNumber || card.card_no || card.number || "").trim();
      if (no) return `NO:${no.toUpperCase()}`;
      const id = String(card.id || card.cardId || "").trim();
      const stripped = id.replace(/(_[A-Z0-9]+)?(__\d+)?$/i, "");
      if (stripped) return `ID:${stripped.toUpperCase()}`;
      return `NAME:${String(card.name || card.title || "").trim()}`;
    }

    function getVariantKey(card) {
      const id = String(card.id || card.cardId || "").trim();
      const rarity = String(card.rarity || "").trim();
      const img = String(card.imageUrl || card.image || card.img || card.src || "").trim();
      return id || `${getBaseCardKey(card)}::${rarity}::${img}`;
    }

    function detectColor(card) {
      const raw = String(
        card.color || card.civilization || card.civ || card.attribute || card.element || ""
      ).trim();
      if (raw) return raw;
      return "無色";
    }

    function buildVariantGroups(cards) {
      const map = new Map();
      for (const c of cards) {
        if (!c || typeof c !== "object") continue;
        const baseKey = getBaseCardKey(c);
        const variantKey = getVariantKey(c);
        const entry = {
          variantKey,
          baseKey,
          cardId: String(c.id || c.cardId || ""),
          cardNumber: String(c.cardNumber || c.card_no || c.number || c.id || ""),
          name: String(c.name || c.title || "名称未設定"),
          rarity: String(c.rarity || "STD"),
          color: detectColor(c),
          imageUrl: String(c.imageUrl || c.image || c.img || c.src || "").trim(),
        };
        if (!map.has(baseKey)) map.set(baseKey, []);
        const list = map.get(baseKey);
        if (!list.some((x) => x.variantKey === variantKey)) {
          list.push(entry);
        }
      }
      return map;
    }

    function findEntryByVariantKey(variantKey) {
      for (const list of variantGroups.values()) {
        const hit = list.find((x) => x.variantKey === variantKey);
        if (hit) return hit;
      }
      return null;
    }

    function saveZones() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            main: deckZones.main.map((x) => x.variantKey),
            sub: deckZones.sub.map((x) => x.variantKey),
          })
        );
      } catch (_) {}
    }

    function loadZones() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
        deckZones.main = Array.isArray(parsed.main)
          ? parsed.main.slice(0, MAX_MAIN).map(findEntryByVariantKey).filter(Boolean).map((x) => ({ ...x }))
          : [];
        deckZones.sub = Array.isArray(parsed.sub)
          ? parsed.sub.slice(0, MAX_SUB).map(findEntryByVariantKey).filter(Boolean).map((x) => ({ ...x }))
          : [];
      } catch (_) {
        deckZones = { main: [], sub: [] };
      }
    }

    function zoneLimit(z = currentZone) {
      return z === "main" ? MAX_MAIN : MAX_SUB;
    }

    function addToZone(entry, z = currentZone) {
      if (!entry) return;
      const list = deckZones[z];
      const cap = zoneLimit(z);
      if (list.length >= cap) {
        showToast(`${z === "main" ? "メイン" : "サブ"}上限（${cap}枚）です`);
        return;
      }
      list.push({ ...entry });
      saveZones();
      renderDeckZone();
      showToast(`${entry.name}（${entry.rarity}）を追加`);
    }

    function removeFromZoneAt(index, z = currentZone) {
      const list = deckZones[z];
      if (index < 0 || index >= list.length) return;
      const removed = list.splice(index, 1)[0];
      saveZones();
      renderDeckZone();
      if (removed) showToast(`${removed.name} を1枚削除`);
    }

    function renderDeckZone() {
      const list = deckZones[currentZone];
      const cap = zoneLimit(currentZone);
      const labelPrefix = currentZone === "main" ? "MAIN" : "SUB";
      document.getElementById("zoneCountLabel").innerHTML =
        `${labelPrefix} <span class="num">${list.length}</span> / ${cap} 枚`;

      const guide = document.getElementById("emptyGuide");
      const grid = document.getElementById("deckGrid");

      if (!list.length) {
        guide.style.display = "block";
        grid.style.display = "none";
        grid.innerHTML = "";
        return;
      }

      guide.style.display = "none";
      grid.style.display = "grid";
      grid.innerHTML = "";

      list.forEach((slot, idx) => {
        const el = document.createElement("div");
        el.className = "deck-slot";

        const img = document.createElement("img");
        img.src = slot.imageUrl || "";
        img.alt = slot.name;
        img.loading = "lazy";
        el.appendChild(img);

        const badge = document.createElement("span");
        badge.className = "rarity-badge";
        badge.textContent = slot.rarity || "STD";
        el.appendChild(badge);

        let startY = null;
        let swipedDown = false;

        el.addEventListener("pointerdown", (e) => {
          startY = e.clientY;
          swipedDown = false;
        });

        el.addEventListener("pointermove", (e) => {
          if (startY !== null && e.clientY - startY > 36) {
            swipedDown = true;
          }
        });

        el.addEventListener("pointerup", () => {
          if (swipedDown) {
            removeFromZoneAt(idx, currentZone);
          } else if (startY !== null) {
            openDetailModal(slot.baseKey, slot.variantKey);
          }
          startY = null;
          swipedDown = false;
        });

        grid.appendChild(el);
      });
    }

    function renderCatalog(loadError = "") {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const scroll = document.getElementById("dockScroll");
      scroll.innerHTML = "";

      const entries = [];
      for (const list of variantGroups.values()) {
        const primary = list[0];
        if (!primary) continue;
        if (selectedRarity !== "ALL" && !list.some((v) => v.rarity === selectedRarity)) continue;
        if (selectedColor !== "ALL" && !list.some((v) => v.color === selectedColor)) continue;
        const rarText = list.map((v) => v.rarity).join(" ");
        const hay = `${primary.name} ${primary.cardNumber} ${primary.cardId} ${primary.color} ${rarText}`.toLowerCase();
        if (!q || hay.includes(q)) {
          entries.push({ primary, variants: list });
        }
      }

      document.getElementById("catalogCountLabel").textContent = `${entries.length}件`;

      if (!entries.length) {
        const empty = document.createElement("div");
        empty.style.fontSize = "0.82rem";
        empty.style.color = "var(--muted)";
        empty.style.padding = "10px 4px";
        empty.textContent = loadError
          ? `カードデータを読み込めませんでした（${loadError}）`
          : "該当するカードがありません。";
        scroll.appendChild(empty);
        return;
      }

      for (const { primary, variants } of entries) {
        const cardEl = document.createElement("div");
        cardEl.className = "dock-card";

        const img = document.createElement("img");
        img.src = primary.imageUrl || "";
        img.alt = primary.name;
        img.loading = "lazy";

        const sub = document.createElement("div");
        sub.className = "dock-card-sub";
        sub.textContent = variants.length > 1 ? `${primary.name} (${variants.length}種)` : primary.name;

        cardEl.appendChild(img);
        cardEl.appendChild(sub);

        let startY = null;
        let longPressTimer = null;
        let longPressed = false;
        let swipedUp = false;

        cardEl.addEventListener("pointerdown", (e) => {
          startY = e.clientY;
          longPressed = false;
          swipedUp = false;
          longPressTimer = setTimeout(() => {
            longPressed = true;
            openDetailModal(primary.baseKey, primary.variantKey);
          }, 420);
        });

        cardEl.addEventListener("pointermove", (e) => {
          if (startY !== null && startY - e.clientY > 32) {
            swipedUp = true;
            clearTimeout(longPressTimer);
          }
        });

        cardEl.addEventListener("pointerup", () => {
          clearTimeout(longPressTimer);
          if (longPressed) return;
          if (swipedUp) {
            addToZone(primary, currentZone);
          } else if (startY !== null) {
            addToZone(primary, currentZone);
          }
          startY = null;
        });

        cardEl.addEventListener("pointercancel", () => {
          clearTimeout(longPressTimer);
          startY = null;
        });

        scroll.appendChild(cardEl);
      }
    }

    function getZoneIndicesForBaseKey(baseKey, z = currentZone) {
      const out = [];
      deckZones[z].forEach((slot, idx) => {
        if (slot.baseKey === baseKey) out.push(idx);
      });
      return out;
    }

    function openDetailModal(baseKey, preferredVariantKey = null) {
      const variants = variantGroups.get(baseKey) || [];
      if (!variants.length) return;

      const indices = getZoneIndicesForBaseKey(baseKey, currentZone);
      if (indices.length > 0) {
        activeCopyIndex = Math.max(0, Math.min(activeCopyIndex, indices.length - 1));
      } else {
        activeCopyIndex = 0;
      }

      const activeSlot = indices.length > 0 ? deckZones[currentZone][indices[activeCopyIndex]] : null;
      const selected =
        variants.find((v) => v.variantKey === (activeSlot ? activeSlot.variantKey : preferredVariantKey)) ||
        variants[0];

      document.getElementById("detailTitle").textContent = selected.name;
      document.getElementById("detailPreviewImg").src = selected.imageUrl || "";
      document.getElementById("detailMeta").textContent =
        `型番: ${selected.cardNumber || "-"} / 文明・色: ${selected.color} / 現在の枠内枚数: ${indices.length}枚`;

      const copyWrap = document.getElementById("copySelectorWrap");
      const copyTabs = document.getElementById("copyTabs");
      copyTabs.innerHTML = "";

      if (indices.length > 0) {
        copyWrap.style.display = "block";
        indices.forEach((slotIdx, i) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "copy-tab" + (i === activeCopyIndex ? " active" : "");
          btn.textContent = `${i + 1}枚目 (${deckZones[currentZone][slotIdx].rarity})`;
          btn.addEventListener("click", () => {
            activeCopyIndex = i;
            openDetailModal(baseKey, deckZones[currentZone][slotIdx].variantKey);
          });
          copyTabs.appendChild(btn);
        });
      } else {
        copyWrap.style.display = "none";
      }

      const strip = document.getElementById("variantStrip");
      strip.innerHTML = "";
      variants.forEach((v) => {
        const item = document.createElement("div");
        item.className = "variant-item" + (v.variantKey === selected.variantKey ? " selected" : "");

        const img = document.createElement("img");
        img.src = v.imageUrl || "";
        img.alt = v.rarity;

        const lbl = document.createElement("div");
        lbl.className = "variant-label";
        lbl.textContent = v.rarity;

        item.appendChild(img);
        item.appendChild(lbl);

        item.addEventListener("click", () => {
          if (indices.length > 0) {
            const targetIdx = indices[activeCopyIndex];
            deckZones[currentZone][targetIdx] = { ...v };
            saveZones();
            renderDeckZone();
            showToast(`${activeCopyIndex + 1}枚目を ${v.rarity} に変更`);
          }
          openDetailModal(baseKey, v.variantKey);
        });

        strip.appendChild(item);
      });

      document.getElementById("btnAddOneCopy").onclick = () => {
        addToZone(selected, currentZone);
        const updated = getZoneIndicesForBaseKey(baseKey, currentZone);
        activeCopyIndex = Math.max(0, updated.length - 1);
        openDetailModal(baseKey, selected.variantKey);
      };

      document.getElementById("btnRemoveOneCopy").onclick = () => {
        const updated = getZoneIndicesForBaseKey(baseKey, currentZone);
        if (!updated.length) return;
        const targetIdx = updated[Math.min(activeCopyIndex, updated.length - 1)];
        removeFromZoneAt(targetIdx, currentZone);
        openDetailModal(baseKey, selected.variantKey);
      };

      const modal = document.getElementById("detailModal");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      m.classList.remove("open");
      m.setAttribute("aria-hidden", "true");
    }

    document.getElementById("closeDetailModal").addEventListener("click", () => closeModal("detailModal"));
    document.getElementById("detailModal").addEventListener("click", (e) => {
      if (e.target.id === "detailModal") closeModal("detailModal");
    });

    document.querySelectorAll(".zone-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".zone-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        currentZone = tab.dataset.zone;
        renderDeckZone();
      });
    });

    function buildFilterChips() {
      const rarSet = new Set(["ALL"]);
      const colSet = new Set(["ALL"]);
      for (const list of variantGroups.values()) {
        for (const v of list) {
          if (v.rarity) rarSet.add(v.rarity);
          if (v.color) colSet.add(v.color);
        }
      }
      const rBox = document.getElementById("rarityChips");
      rBox.innerHTML = "";
      rarSet.forEach((r) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (selectedRarity === r ? " active" : "");
        b.textContent = r === "ALL" ? "すべて" : r;
        b.onclick = () => {
          selectedRarity = r;
          buildFilterChips();
          renderCatalog();
        };
        rBox.appendChild(b);
      });

      const cBox = document.getElementById("colorChips");
      cBox.innerHTML = "";
      colSet.forEach((c) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (selectedColor === c ? " active" : "");
        b.textContent = c === "ALL" ? "すべて" : c;
        b.onclick = () => {
          selectedColor = c;
          buildFilterChips();
          renderCatalog();
        };
        cBox.appendChild(b);
      });
    }

    document.getElementById("btnOpenFilter").addEventListener("click", () => {
      buildFilterChips();
      document.getElementById("filterModal").classList.add("open");
    });
    document.getElementById("closeFilterModal").addEventListener("click", () => closeModal("filterModal"));
    document.getElementById("btnResetFilter").addEventListener("click", () => {
      selectedRarity = "ALL";
      selectedColor = "ALL";
      buildFilterChips();
      renderCatalog();
    });

    document.getElementById("btnStats").addEventListener("click", () => {
      const list = deckZones[currentZone];
      const byColor = {};
      const byRarity = {};
      for (const s of list) {
        byColor[s.color || "無色"] = (byColor[s.color || "無色"] || 0) + 1;
        byRarity[s.rarity || "STD"] = (byRarity[s.rarity || "STD"] || 0) + 1;
      }
      document.getElementById("statsBody").innerHTML = `
        <div><strong>枚数:</strong> ${list.length} / ${zoneLimit(currentZone)}枚</div>
        <div style="margin-top:8px;"><strong>文明・色別:</strong> ${Object.entries(byColor).map(([k, v]) => `${k} ${v}枚`).join(" / ") || "なし"}</div>
        <div style="margin-top:8px;"><strong>レアリティ別:</strong> ${Object.entries(byRarity).map(([k, v]) => `${k} ${v}枚`).join(" / ") || "なし"}</div>
      `;
      document.getElementById("statsModal").classList.add("open");
    });
    document.getElementById("closeStatsModal").addEventListener("click", () => closeModal("statsModal"));

    function getSavedDecks() {
      try {
        return JSON.parse(localStorage.getItem(SAVED_KEY) || "[]");
      } catch (_) {
        return [];
      }
    }
    function renderSavedDecks() {
      const box = document.getElementById("savedListBody");
      const list = getSavedDecks();
      if (!list.length) {
        box.innerHTML = `<div style="color:var(--muted);">保存されたデッキはありません。</div>`;
        return;
      }
      box.innerHTML = "";
      list.forEach((item, idx) => {
        const row = document.createElement("div");
        row.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);";
        row.innerHTML = `<span><strong>${item.name}</strong> (${(item.main || []).length}枚)</span>`;
        const act = document.createElement("div");
        act.style.display = "flex";
        act.style.gap = "6px";

        const loadBtn = document.createElement("button");
        loadBtn.type = "button";
        loadBtn.textContent = "読込";
        loadBtn.onclick = () => {
          deckZones.main = (item.main || []).map(findEntryByVariantKey).filter(Boolean).map((x) => ({ ...x }));
          deckZones.sub = (item.sub || []).map(findEntryByVariantKey).filter(Boolean).map((x) => ({ ...x }));
          saveZones();
          renderDeckZone();
          closeModal("savedModal");
          showToast(`「${item.name}」を読み込みました`);
        };

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "danger";
        delBtn.textContent = "削除";
        delBtn.onclick = () => {
          const next = getSavedDecks();
          next.splice(idx, 1);
          localStorage.setItem(SAVED_KEY, JSON.stringify(next));
          renderSavedDecks();
        };

        act.appendChild(loadBtn);
        act.appendChild(delBtn);
        row.appendChild(act);
        box.appendChild(row);
      });
    }

    document.getElementById("btnSavedList").addEventListener("click", () => {
      renderSavedDecks();
      document.getElementById("savedModal").classList.add("open");
    });
    document.getElementById("closeSavedModal").addEventListener("click", () => closeModal("savedModal"));
    document.getElementById("btnSaveCurrent").addEventListener("click", () => {
      const name = document.getElementById("saveNameInput").value.trim() || `デッキ ${getSavedDecks().length + 1}`;
      const list = getSavedDecks();
      list.unshift({
        name,
        main: deckZones.main.map((x) => x.variantKey),
        sub: deckZones.sub.map((x) => x.variantKey),
      });
      localStorage.setItem(SAVED_KEY, JSON.stringify(list.slice(0, 30)));
      document.getElementById("saveNameInput").value = "";
      renderSavedDecks();
      showToast("デッキを保存しました");
    });

    document.getElementById("btnOpenClear").addEventListener("click", () => {
      document.getElementById("clearModal").classList.add("open");
    });
    document.getElementById("btnCancelClear").addEventListener("click", () => closeModal("clearModal"));
    document.getElementById("btnConfirmClear").addEventListener("click", () => {
      deckZones[currentZone] = [];
      saveZones();
      renderDeckZone();
      closeModal("clearModal");
      showToast("クリアしました");
    });

    function buildExportText() {
      const list = deckZones[currentZone];
      const map = new Map();
      for (const s of list) {
        const key = `${s.name}__${s.rarity}`;
        if (!map.has(key)) map.set(key, { name: s.name, rarity: s.rarity, cardNumber: s.cardNumber, count: 0 });
        map.get(key).count += 1;
      }
      const lines = [`【HOROBEAT ${currentZone.toUpperCase()} (${list.length}/${zoneLimit(currentZone)})】`];
      for (const item of map.values()) {
        lines.push(`${item.count} x ${item.name} [${item.rarity}] ${item.cardNumber ? `(${item.cardNumber})` : ""}`.trim());
      }
      return lines.join("\n");
    }

    document.getElementById("btnExport").addEventListener("click", () => {
      document.getElementById("exportText").value = buildExportText();
      document.getElementById("generatedImgWrap").innerHTML = "";
      document.getElementById("exportModal").classList.add("open");
    });
    document.getElementById("closeExportModal").addEventListener("click", () => closeModal("exportModal"));
    document.getElementById("btnCopyText").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(document.getElementById("exportText").value);
        showToast("コピーしました");
      } catch (_) {
        showToast("コピーに失敗しました");
      }
    });

    async function loadImageSafe(url) {
      if (!url) return null;
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        const t = setTimeout(() => resolve(null), 6000);
        img.onload = () => {
          clearTimeout(t);
          resolve(img);
        };
        img.onerror = () => {
          clearTimeout(t);
          resolve(null);
        };
        img.src = url;
      });
    }

    document.getElementById("btnGenerateImage").addEventListener("click", async () => {
      const list = deckZones[currentZone];
      if (!list.length) {
        showToast("カードがありません");
        return;
      }
      const wrap = document.getElementById("generatedImgWrap");
      wrap.innerHTML = `<div style="font-size:0.82rem;color:var(--muted);">画像を生成中...</div>`;
      try {
        const cols = 10;
        const rows = Math.max(1, Math.ceil(list.length / cols));
        const cardW = 140;
        const cardH = 196;
        const gap = 10;
        const pad = 20;
        const headerH = 44;

        const canvas = document.createElement("canvas");
        canvas.width = pad * 2 + cols * cardW + (cols - 1) * gap;
        canvas.height = pad * 2 + headerH + rows * cardH + (rows - 1) * gap;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f4f4f6";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#111114";
        ctx.font = "700 22px 'Playfair Display', Georgia, serif";
        ctx.fillText(`HOROBEAT STUDIO (${list.length}/${zoneLimit(currentZone)})`, pad, pad + 24);

        const imgs = await Promise.all(list.map((s) => loadImageSafe(s.imageUrl)));
        list.forEach((slot, idx) => {
          const c = idx % cols;
          const r = Math.floor(idx / cols);
          const x = pad + c * (cardW + gap);
          const y = pad + headerH + r * (cardH + gap);

          ctx.fillStyle = "#e2e2e7";
          ctx.fillRect(x, y, cardW, cardH);

          const img = imgs[idx];
          if (img) {
            try {
              ctx.drawImage(img, x, y, cardW, cardH);
            } catch (_) {
              ctx.fillStyle = "#52525b";
              ctx.font = "12px sans-serif";
              ctx.fillText(slot.name.slice(0, 10), x + 8, y + 24);
            }
          } else {
            ctx.fillStyle = "#52525b";
            ctx.font = "12px sans-serif";
            ctx.fillText(slot.name.slice(0, 10), x + 8, y + 24);
          }

          ctx.fillStyle = "rgba(17, 17, 20, 0.86)";
          ctx.fillRect(x + 6, y + cardH - 24, 46, 18);
          ctx.fillStyle = "#ffffff";
          ctx.font = "700 11px sans-serif";
          ctx.fillText(slot.rarity || "STD", x + 11, y + cardH - 11);
        });

        const dataUrl = canvas.toDataURL("image/png");
        wrap.innerHTML = "";
        const outImg = document.createElement("img");
        outImg.src = dataUrl;
        outImg.alt = "デッキ画像";
        outImg.style.cssText = "width:100%;border-radius:8px;border:1px solid var(--border);";
        wrap.appendChild(outImg);
        showToast("デッキ画像を生成しました");
      } catch (err) {
        wrap.innerHTML = `<div style="font-size:0.82rem;color:var(--danger);">画像生成エラー: ${String(err && err.message || err)}</div>`;
      }
    });

    document.getElementById("searchInput").addEventListener("input", () => renderCatalog());
    document.getElementById("btnClearSearch").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      renderCatalog();
    });

    async function init() {
      const res = await fetchCardsWithFallback();
      allCards = res.cards;
      variantGroups = buildVariantGroups(allCards);
      loadZones();
      renderDeckZone();
      renderCatalog(res.error);
    }

    init();
  </script>
</body>
</html>
