<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HOROBEAT STUDIO</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root {
--bg: #f4f4f6;
--paper: #ffffff;
--sub: #ececef;
--ink: #111114;
--muted: #666670;
--line: #222429;
--soft-line: #dfe1e7;
--accent: #111114;
--badge-bg: #f0f1f5;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
html, body {
height: 100%;
background-color: var(--bg);
color: var(--ink);
font-family: "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
overflow: hidden;
}
.top-screen {
height: 100dvh;
width: 100%;
display: flex;
align-items: center;
justify-content: center;
padding: 16px;
background-color: var(--bg);
background-image:
linear-gradient(to right, rgba(17, 17, 20, 0.035) 1px, transparent 1px),
linear-gradient(to bottom, rgba(17, 17, 20, 0.035) 1px, transparent 1px);
background-size: 24px 24px;
}
.top-card {
width: 100%;
max-width: 440px;
height: 100%;
max-height: 680px;
background: var(--paper);
border: 2px solid var(--line);
border-radius: 6px;
box-shadow: 6px 6px 0 rgba(17, 17, 20, 0.14);
padding: 20px 22px;
display: flex;
flex-direction: column;
gap: 14px;
overflow: hidden;
}
.top-brand {
border-bottom: 1.5px solid var(--line);
padding-bottom: 10px;
display: flex;
align-items: baseline;
justify-content: space-between;
gap: 8px;
flex-shrink: 0;
}
.top-brand-title {
font-family: "Playfair Display", Georgia, serif;
font-size: 1.3rem;
font-weight: 700;
letter-spacing: 0.06em;
}
.top-brand-sub {
font-size: 0.72rem;
color: var(--muted);
}
.top-actions {
display: flex;
flex-direction: column;
gap: 12px;
flex-shrink: 0;
}
.top-btn {
width: 100%;
background: var(--paper);
color: var(--ink);
border: 1.5px solid var(--line);
border-radius: 4px;
padding: 14px 16px;
font-size: 1rem;
font-weight: 700;
display: flex;
align-items: center;
justify-content: space-between;
cursor: pointer;
text-decoration: none;
box-shadow: 3px 3px 0 var(--line);
transition: background-color 0.12s ease, color 0.12s ease, transform 0.1s ease;
}
.top-btn:hover {
background: var(--accent);
color: var(--paper);
}
.top-btn:active {
transform: translate(2px, 2px);
box-shadow: 1px 1px 0 var(--line);
}
.btn {
background: var(--paper);
color: var(--ink);
border: 1px solid var(--line);
border-radius: 4px;
padding: 4px 8px;
font-size: 0.74rem;
font-weight: 700;
cursor: pointer;
box-shadow: 1.5px 1.5px 0 var(--line);
white-space: nowrap;
}
.btn:hover {
background: var(--accent);
color: var(--paper);
}
.top-results-box {
flex: 1;
min-height: 0;
border: 1px solid var(--soft-line);
border-radius: 4px;
background: #fafafa;
padding: 10px 12px;
display: none;
flex-direction: column;
gap: 8px;
overflow: hidden;
}
.top-results-box.is-open {
display: flex;
}
.top-results-head {
display: flex;
align-items: center;
justify-content: space-between;
font-size: 0.84rem;
font-weight: 700;
flex-shrink: 0;
}
.top-results-list {
list-style: none;
overflow-y: auto;
display: flex;
flex-direction: column;
gap: 8px;
padding-right: 2px;
}
.top-result-item {
background: var(--paper);
border: 1px solid var(--soft-line);
border-radius: 4px;
padding: 8px 10px;
font-size: 0.78rem;
display: flex;
flex-direction: column;
gap: 3px;
}
</style>
</head>
<body>
<main class="top-screen" aria-label="HOROBEAT STUDIO トップ">
<div class="top-card">
<header class="top-brand">
<h1 class="top-brand-title">HOROBEAT STUDIO</h1>
<span class="top-brand-sub">DECK & META</span>
</header>
<nav class="top-actions" aria-label="メインメニュー">
<a href="./make.html" class="top-btn" id="linkGoDeckBuilder">
<span>デッキ作成</span>
<span>→</span>
</a>
<button type="button" class="top-btn" id="btnToggleResults">
<span>入賞リスト確認</span>
<span>→</span>
</button>
</nav>
<section class="top-results-box" id="topResultsBox" aria-label="入賞リスト">
<div class="top-results-head">
<span id="topResultsTitle">入賞リスト</span>
<button type="button" class="btn" id="btnCloseResults">閉じる</button>
</div>
<ul class="top-results-list" id="topResultsList"></ul>
</section>
</div>
</main>
<script>
(function () {
const FALLBACK_RESULTS = [
{
date: "2026-11-20",
tournament: "ホロビート名人戦",
rank: "優勝",
rawText: "本日のホロビート名人戦、優勝デッキレシピを公開しました。"
},
{
date: "2026-11-18",
tournament: "ホロビート大会",
rank: "準優勝",
rawText: "ショップ大会 準優勝構築。序盤からテンポを取るビート型。"
}
];
const topResultsBox = document.getElementById("topResultsBox");
const topResultsTitle = document.getElementById("topResultsTitle");
const topResultsList = document.getElementById("topResultsList");
function renderTopResults(list, label) {
topResultsTitle.textContent = label + " (" + list.length + "件)";
topResultsList.innerHTML = "";
if (!list.length) {
topResultsList.innerHTML = '<li class="top-result-item">データがありません</li>';
return;
}
list.forEach(function (item) {
const li = document.createElement("li");
li.className = "top-result-item";
li.innerHTML =
"<strong>" + (item.date || "") + " / " + (item.tournament || "") + " / " + (item.rank || "") + "</strong>" +
"<span>" + (item.rawText || item.deckName || "") + "</span>";
topResultsList.appendChild(li);
});
}
document.getElementById("btnToggleResults").addEventListener("click", function () {
topResultsBox.classList.add("is-open");
topResultsTitle.textContent = "入賞リスト（読込中...）";
fetch("./data/tournament_results.json", { cache: "no-store" })
.then(function (r) {
if (!r.ok) throw new Error("not found");
return r.json();
})
.then(function (data) {
const list = Array.isArray(data) ? data : (Array.isArray(data.items) ? data.items : []);
renderTopResults(list, "入賞リスト");
})
.catch(function () {
renderTopResults(FALLBACK_RESULTS, "入賞リスト（サンプル）");
});
});
document.getElementById("btnCloseResults").addEventListener("click", function () {
topResultsBox.classList.remove("is-open");
});
})();
</script>
</body>
</html>
