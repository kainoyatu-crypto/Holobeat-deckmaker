<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>DECK MAKER | ホロビートカードゲーム</title>
  <style>
    :root {
      --bg-dark: #0e141b;
      --bg-panel: #161f29;
      --bg-deck: #ffffff;
      --accent-teal: #2ea7b8;
      --accent-teal-dark: #228492;
      --text-main: #ffffff;
      --text-muted: #9eb0c2;
      --border-subtle: rgba(255, 255, 255, 0.12);
      --card-ratio: 63 / 88;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 640px;
      margin: 0 auto;
      background: var(--bg-dark);
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 1. トップヘッダー */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 6px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 900;
      font-size: 18px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      cursor: pointer;
      padding: 2px 4px;
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
    }

    /* 2. タブ & 分析バー */
    .tab-bar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 10px;
      gap: 6px;
      flex-shrink: 0;
    }

    .tabs-left {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .tabs-left::-webkit-scrollbar { display: none; }

    .deck-tab {
      border: none;
      border-radius: 6px 6px 0 0;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      background: #cfd6dd;
      color: #222b35;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    .deck-tab.active {
      background: #ffffff;
      color: #0e141b;
      padding-top: 10px;
    }

    .analysis-btn {
      background: var(--accent-teal);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 4px;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.15;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* 3. 中央デッキ表示エリア（白キャンバス・8列グリッド） */
    .deck-stage-wrap {
      flex: 1 1 auto;
      min-height: 0;
      padding: 0 10px 6px;
      display: flex;
      flex-direction: column;
    }

    .deck-stage {
      flex: 1 1 auto;
      min-height: 0;
      background: var(--bg-deck);
      border-radius: 0 8px 8px 8px;
      padding: 6px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      align-content: start;
      gap: 3px;
      position: relative;
    }

    .deck-empty-hint {
      grid-column: 1 / -1;
      color: #64748b;
      font-size: 12px;
      text-align: center;
      padding: 28px 12px;
      line-height: 1.6;
    }

    .deck-card-slot {
      aspect-ratio: var(--card-ratio);
      border-radius: 3px;
      overflow: hidden;
      background: #1e293b;
      position: relative;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.22);
      touch-action: pan-y;
    }

    .deck-card-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px;
      font-size: 7px;
      line-height: 1.15;
      color: #fff;
      background: linear-gradient(145deg, #273649, #141c26);
      text-align: center;
      overflow: hidden;
    }

    /* 4. カードプール横スクロール帯 */
    .pool-strip-wrap {
      flex-shrink: 0;
      background: #d8dee4;
      padding: 6px 0;
      border-top: 1px solid rgba(0,0,0,0.1);
    }

    .pool-strip {
      display: flex;
      flex-direction: row;
      gap: 6px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0 10px;
      scroll-snap-type: x proximity;
      scrollbar-width: none;
    }
    .pool-strip::-webkit-scrollbar { display: none; }

    .pool-card {
      flex: 0 0 auto;
      width: 68px;
      aspect-ratio: var(--card-ratio);
      border-radius: 5px;
      overflow: hidden;
      background: #1a2430;
      position: relative;
      scroll-snap-align: start;
      box-shadow: 0 2px 5px rgba(0,0,0,0.28);
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .pool-card:active {
      transform: scale(0.95);
    }

    .pool-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
    }

    .pool-card .card-fallback {
      font-size: 9px;
      padding: 5px 3px;
    }

    .pool-badge {
      position: absolute;
      bottom: 3px;
      right: 3px;
      background: rgba(14, 20, 27, 0.88);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      display: grid;
      place-items: center;
    }

    .pool-badge.maxed {
      background: #e11d48;
      border-color: #fda4af;
    }

    /* 5. 下部検索・絞り込み・並べ替えバー */
    .bottom-bar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      background: var(--bg-dark);
    }

    .search-box {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      background: #ffffff;
      border-radius: 6px;
      padding: 0 10px;
      height: 38px;
      gap: 6px;
    }

    .search-box svg {
      width: 16px;
      height: 16px;
      color: #64748b;
      flex-shrink: 0;
    }

    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      color: #0f172a;
      background: transparent;
      user-select: text;
    }

    .clear-search {
      border: none;
      background: none;
      color: #94a3b8;
      font-size: 16px;
      padding: 0 2px;
      cursor: pointer;
    }

    .tool-btn {
      flex: 0 0 auto;
      height: 38px;
      min-width: 62px;
      background: var(--accent-teal);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      padding: 0 8px;
    }

    .tool-btn.has-filter {
      background: #f59e0b;
      color: #0e141b;
    }

    /* モーダル共通 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.72);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 640px;
      background: #18222d;
      color: #fff;
      border-radius: 16px 16px 0 0;
      padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      max-height: 82dvh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 800;
      font-size: 15px;
    }

    .modal-close {
      background: rgba(255,255,255,0.12);
      border: none;
      color: #fff;
      border-radius: 999px;
      width: 28px;
      height: 28px;
      font-size: 16px;
      cursor: pointer;
    }

    .chip-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .chip {
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      color: #fff;
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.active {
      background: var(--accent-teal);
      border-color: var(--accent-teal);
    }

    .action-primary {
      width: 100%;
      background: var(--accent-teal);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }

    .deck-text-output {
      width: 100%;
      height: 160px;
      background: #0e141b;
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      font-family: monospace;
      user-select: text;
    }

    .preview-card-img {
      width: 220px;
      max-width: 65vw;
      border-radius: 10px;
      display: block;
      margin: 0 auto 12px;
    }

    .toast {
      position: fixed;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.94);
      color: #fff;
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(255,255,255,0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 200;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- 1. トップヘッダー -->
    <header class="top-header">
      <div class="brand">
        <div class="brand-icon">彡</div>
        <div>
          <div class="brand-title">DECK MAKER</div>
          <div class="brand-sub">ホロビートカードゲーム</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btnClearDeck" title="全削除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>
          </svg>
          <span>全削除</span>
        </button>
        <button class="icon-btn" id="btnSaveDeck" title="保存・共有">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="4" width="16" height="16" rx="2"/>
            <path d="M8 12l3 3 5-6"/>
          </svg>
          <span>保存</span>
        </button>
      </div>
    </header>

    <!-- 2. タブ & 分析 -->
    <div class="tab-bar">
      <div class="tabs-left">
        <button class="deck-tab active" data-zone="main" id="tabMain">メイン <span id="mainCount">0</span></button>
        <button class="deck-tab" data-zone="sub" id="tabSub">サブ / 予備 <span id="subCount">0</span></button>
      </div>
      <button class="analysis-btn" id="btnAnalysis">
        <span>📊</span>
        <span>分析 ⌄</span>
      </button>
    </div>

    <!-- 3. デッキ表示エリア（8列グリッド） -->
    <main class="deck-stage-wrap">
      <div class="deck-stage" id="deckStage"></div>
    </main>

    <!-- 4. カードプール横スクロール帯 -->
    <section class="pool-strip-wrap">
      <div class="pool-strip" id="poolStrip"></div>
    </section>

    <!-- 5. 下部検索・絞り込み・並べ替えバー -->
    <footer class="bottom-bar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.5-3.5"/>
        </svg>
        <input type="search" id="searchInput" placeholder="カード名・型番" />
        <button class="clear-search" id="btnClearSearch" aria-label="クリア">×</button>
      </div>
      <button class="tool-btn" id="btnFilter">
        <span>🎛️</span>
        <span>絞り込み</span>
      </button>
      <button class="tool-btn" id="btnSort">
        <span>⇅</span>
        <span>並べ替え</span>
      </button>
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 絞り込みモーダル -->
  <div class="modal-backdrop" id="filterModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span>絞り込み</span>
        <button class="modal-close" data-close="filterModal">×</button>
      </div>
      <div style="font-size:12px;color:#9eb0c2;margin-bottom:6px;">色</div>
      <div class="chip-group" id="colorChips"></div>
      <div style="font-size:12px;color:#9eb0c2;margin-bottom:6px;">種類</div>
      <div class="chip-group" id="typeChips"></div>
      <button class="action-primary" id="btnResetFilter">条件をリセット</button>
    </div>
  </div>

  <!-- 並べ替えモーダル -->
  <div class="modal-backdrop" id="sortModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span>並べ替え</span>
        <button class="modal-close" data-close="sortModal">×</button>
      </div>
      <div class="chip-group" id="sortChips">
        <button class="chip active" data-sort="id">型番順</button>
        <button class="chip" data-sort="cost_asc">コスト昇順</button>
        <button class="chip" data-sort="cost_desc">コスト降順</button>
        <button class="chip" data-sort="name">カード名順</button>
      </div>
    </div>
  </div>

  <!-- 分析モーダル -->
  <div class="modal-backdrop" id="analysisModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span>デッキ分析</span>
        <button class="modal-close" data-close="analysisModal">×</button>
      </div>
      <div id="analysisBody" style="font-size:13px;line-height:1.7;"></div>
    </div>
  </div>

  <!-- 保存・共有モーダル -->
  <div class="modal-backdrop" id="saveModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span>デッキ保存・共有</span>
        <button class="modal-close" data-close="saveModal">×</button>
      </div>
      <textarea class="deck-text-output" id="deckRecipeText" readonly></textarea>
      <button class="action-primary" id="btnCopyRecipe">レシピテキストをコピー</button>
      <button class="action-primary" id="btnCopyShareUrl" style="background:#334155;">共有URLをコピー</button>
    </div>
  </div>

  <!-- カード拡大プレビューモーダル -->
  <div class="modal-backdrop" id="previewModal">
    <div class="modal-sheet">
      <div class="modal-header">
        <span id="previewTitle">カード詳細</span>
        <button class="modal-close" data-close="previewModal">×</button>
      </div>
      <div id="previewContent"></div>
    </div>
  </div>

  <script>
    const MAX_COPIES = 4;
    const STORAGE_KEY = "horobeat_deckmaker_v1";

    let allCards = [];
    let currentZone = "main"; // "main" | "sub"
    let deck = { main: {}, sub: {} }; // { cardId: count }
    let filterState = { query: "", color: "ALL", type: "ALL", sort: "id" };

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => el.classList.remove("show"), 1600);
    }

    function totalInZone(zone) {
      return Object.values(deck[zone]).reduce((a, b) => a + b, 0);
    }

    function totalCopies(cardId) {
      return (deck.main[cardId] || 0) + (deck.sub[cardId] || 0);
    }

    function saveLocal() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(deck));
      } catch (e) {}
    }

    function loadLocalOrUrl() {
      const params = new URLSearchParams(location.search);
      const shared = params.get("d");
      if (shared) {
        try {
          const parsed = JSON.parse(decodeURIComponent(escape(atob(shared))));
          if (parsed && typeof parsed === "object") {
            deck = { main: parsed.main || {}, sub: parsed.sub || {} };
            return;
          }
        } catch (e) {}
      }
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          deck = { main: parsed.main || {}, sub: parsed.sub || {} };
        }
      } catch (e) {}
    }

    function addCard(cardId) {
      const current = totalCopies(cardId);
      if (current >= MAX_COPIES) {
        showToast(`同名カードは最大${MAX_COPIES}枚までです`);
        return;
      }
      deck[currentZone][cardId] = (deck[currentZone][cardId] || 0) + 1;
      saveLocal();
      renderAll();
    }

    function removeCard(cardId) {
      if (!deck[currentZone][cardId]) return;
      deck[currentZone][cardId] -= 1;
      if (deck[currentZone][cardId] <= 0) {
        delete deck[currentZone][cardId];
      }
      saveLocal();
      renderAll();
    }

    function getCardMap() {
      const map = new Map();
      allCards.forEach(c => map.set(c.id, c));
      return map;
    }

    function createCardVisual(card, isSmall) {
      if (card.imageUrl) {
        const img = document.createElement("img");
        img.src = card.imageUrl;
        img.alt = card.name || card.id;
        img.loading = "lazy";
        img.onerror = () => {
          img.replaceWith(createFallbackBox(card));
        };
        return img;
      }
      return createFallbackBox(card);
    }

    function createFallbackBox(card) {
      const box = document.createElement("div");
      box.className = "card-fallback";
      box.innerHTML = `
        <div style="opacity:.75;font-weight:700;">${card.id || ""}</div>
        <div style="font-weight:800;">${card.name || ""}</div>
        <div style="opacity:.75;">${card.type || ""}</div>
      `;
      return box;
    }

    function renderDeckStage() {
      const stage = document.getElementById("deckStage");
      stage.innerHTML = "";

      const cardMap = getCardMap();
      const entries = Object.entries(deck[currentZone])
        .filter(([, count]) => count > 0)
        .map(([id, count]) => ({ card: cardMap.get(id) || { id, name: id }, count }));

      entries.sort((a, b) => {
        const ca = Number(a.card.cost ?? 99);
        const cb = Number(b.card.cost ?? 99);
        if (ca !== cb) return ca - cb;
        return String(a.card.id).localeCompare(String(b.card.id), "ja");
      });

      if (entries.length === 0) {
        const hint = document.createElement("div");
        hint.className = "deck-empty-hint";
        hint.innerHTML = "下のカードをタップ（または上スワイプ）で追加<br>デッキ内のカードをタップ（または下スワイプ）で1枚削除";
        stage.appendChild(hint);
        return;
      }

      entries.forEach(({ card, count }) => {
        for (let i = 0; i < count; i++) {
          const slot = document.createElement("div");
          slot.className = "deck-card-slot";
          slot.appendChild(createCardVisual(card, true));

          let startY = 0;
          slot.addEventListener("touchstart", (e) => {
            startY = e.touches[0].clientY;
          }, { passive: true });

          slot.addEventListener("touchend", (e) => {
            const dy = e.changedTouches[0].clientY - startY;
            if (dy > 24) {
              e.preventDefault();
              removeCard(card.id);
            }
          });

          slot.addEventListener("click", () => removeCard(card.id));
          stage.appendChild(slot);
        }
      });
    }

    function getFilteredCards() {
      const q = filterState.query.trim().toLowerCase();
      let list = allCards.filter(c => {
        if (filterState.color !== "ALL" && (c.color || "無") !== filterState.color) return false;
        if (filterState.type !== "ALL" && (c.type || "その他") !== filterState.type) return false;
        if (q) {
          const hay = `${c.id || ""} ${c.name || ""} ${c.text || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      list.sort((a, b) => {
        if (filterState.sort === "cost_asc") return Number(a.cost ?? 99) - Number(b.cost ?? 99);
        if (filterState.sort === "cost_desc") return Number(b.cost ?? -1) - Number(a.cost ?? -1);
        if (filterState.sort === "name") return String(a.name || "").localeCompare(String(b.name || ""), "ja");
        return String(a.id || "").localeCompare(String(b.id || ""), "ja");
      });

      return list;
    }

    function renderPoolStrip() {
      const strip = document.getElementById("poolStrip");
      strip.innerHTML = "";
      const list = getFilteredCards();

      list.forEach(card => {
        const el = document.createElement("div");
        el.className = "pool-card";
        el.appendChild(createCardVisual(card, false));

        const count = totalCopies(card.id);
        if (count > 0) {
          const badge = document.createElement("div");
          badge.className = "pool-badge" + (count >= MAX_COPIES ? " maxed" : "");
          badge.textContent = count;
          el.appendChild(badge);
        }

        let startX = 0, startY = 0, pressTimer = null, longPressed = false;

        el.addEventListener("touchstart", (e) => {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          longPressed = false;
          pressTimer = setTimeout(() => {
            longPressed = true;
            openPreview(card);
          }, 420);
        }, { passive: true });

        el.addEventListener("touchmove", () => {
          clearTimeout(pressTimer);
        }, { passive: true });

        el.addEventListener("touchend", (e) => {
          clearTimeout(pressTimer);
          if (longPressed) return;
          const dx = Math.abs(e.changedTouches[0].clientX - startX);
          const dy = e.changedTouches[0].clientY - startY;
          if (dy < -24 && dx < 30) {
            e.preventDefault();
            addCard(card.id);
          }
        });

        el.addEventListener("click", () => {
          if (!longPressed) addCard(card.id);
        });

        strip.appendChild(el);
      });
    }

    function renderCounts() {
      document.getElementById("mainCount").textContent = totalInZone("main");
      document.getElementById("subCount").textContent = totalInZone("sub");

      const hasFilter = filterState.color !== "ALL" || filterState.type !== "ALL";
      document.getElementById("btnFilter").classList.toggle("has-filter", hasFilter);
    }

    function renderAll() {
      renderCounts();
      renderDeckStage();
      renderPoolStrip();
    }

    function buildFilterChips() {
      const colors = ["ALL", ...new Set(allCards.map(c => c.color || "無").filter(Boolean))];
      const types = ["ALL", ...new Set(allCards.map(c => c.type || "その他").filter(Boolean))];

      const colorBox = document.getElementById("colorChips");
      colorBox.innerHTML = "";
      colors.forEach(col => {
        const btn = document.createElement("button");
        btn.className = "chip" + (filterState.color === col ? " active" : "");
        btn.textContent = col === "ALL" ? "すべて" : col;
        btn.onclick = () => {
          filterState.color = col;
          buildFilterChips();
          renderAll();
        };
        colorBox.appendChild(btn);
      });

      const typeBox = document.getElementById("typeChips");
      typeBox.innerHTML = "";
      types.forEach(tp => {
        const btn = document.createElement("button");
        btn.className = "chip" + (filterState.type === tp ? " active" : "");
        btn.textContent = tp === "ALL" ? "すべて" : tp;
        btn.onclick = () => {
          filterState.type = tp;
          buildFilterChips();
          renderAll();
        };
        typeBox.appendChild(btn);
      });
    }

    function openPreview(card) {
      document.getElementById("previewTitle").textContent = `${card.name || ""} (${card.id || ""})`;
      const box = document.getElementById("previewContent");
      box.innerHTML = `
        ${card.imageUrl ? `<img class="preview-card-img" src="${card.imageUrl}" alt="${card.name || ""}">` : ""}
        <div style="font-size:13px;line-height:1.6;">
          <div><strong>型番:</strong> ${card.id || "-"} / <strong>色:</strong> ${card.color || "-"} / <strong>種類:</strong> ${card.type || "-"} / <strong>コスト:</strong> ${card.cost ?? "-"}</div>
          <p style="color:#cbd5e1;margin:8px 0 12px;">${card.text || ""}</p>
        </div>
        <button class="action-primary" id="previewAddBtn">デッキに1枚追加（現在 ${totalCopies(card.id)}/${MAX_COPIES}枚）</button>
      `;
      document.getElementById("previewAddBtn").onclick = () => {
        addCard(card.id);
        openPreview(card);
      };
      document.getElementById("previewModal").classList.add("open");
    }

    function openAnalysis() {
      const cardMap = getCardMap();
      const byCost = {};
      const byColor = {};
      let total = 0;

      Object.entries(deck[currentZone]).forEach(([id, count]) => {
        const c = cardMap.get(id) || {};
        const cost = c.cost ?? "?";
        const color = c.color || "無";
        byCost[cost] = (byCost[cost] || 0) + count;
        byColor[color] = (byColor[color] || 0) + count;
        total += count;
      });

      const costLines = Object.keys(byCost).sort((a, b) => Number(a) - Number(b))
        .map(k => `コスト ${k}: ${byCost[k]}枚`).join("<br>") || "カードがありません";
      const colorLines = Object.entries(byColor)
        .map(([k, v]) => `${k}: ${v}枚`).join(" / ") || "-";

      document.getElementById("analysisBody").innerHTML = `
        <div style="margin-bottom:8px;"><strong>合計枚数:</strong> ${total}枚</div>
        <div style="margin-bottom:8px;"><strong>色内訳:</strong> ${colorLines}</div>
        <div><strong>コスト分布:</strong><br>${costLines}</div>
      `;
      document.getElementById("analysisModal").classList.add("open");
    }

    function openSaveModal() {
      const cardMap = getCardMap();
      const lines = [`【ホロビート デッキレシピ】`];
      ["main", "sub"].forEach(zone => {
        const entries = Object.entries(deck[zone]).filter(([, n]) => n > 0);
        if (entries.length > 0) {
          lines.push(zone === "main" ? `\n■ メイン (${totalInZone("main")}枚)` : `\n■ サブ (${totalInZone("sub")}枚)`);
          entries.forEach(([id, n]) => {
            const c = cardMap.get(id) || { name: id };
            lines.push(`${n}x ${c.name} [${id}]`);
          });
        }
      });
      document.getElementById("deckRecipeText").value = lines.join("\n");
      document.getElementById("saveModal").classList.add("open");
    }

    function bindEvents() {
      document.querySelectorAll(".deck-tab").forEach(tab => {
        tab.onclick = () => {
          document.querySelectorAll(".deck-tab").forEach(t => t.classList.remove("active"));
          tab.classList.add("active");
          currentZone = tab.dataset.zone;
          renderDeckStage();
        };
      });

      document.getElementById("btnClearDeck").onclick = () => {
        if (totalInZone(currentZone) === 0) return;
        if (confirm("表示中のデッキをすべて削除しますか？")) {
          deck[currentZone] = {};
          saveLocal();
          renderAll();
          showToast("デッキをクリアしました");
        }
      };

      document.getElementById("btnSaveDeck").onclick = openSaveModal;
      document.getElementById("btnAnalysis").onclick = openAnalysis;

      document.getElementById("searchInput").addEventListener("input", (e) => {
        filterState.query = e.target.value;
        renderPoolStrip();
      });

      document.getElementById("btnClearSearch").onclick = () => {
        filterState.query = "";
        document.getElementById("searchInput").value = "";
        renderPoolStrip();
      };

      document.getElementById("btnFilter").onclick = () => {
        buildFilterChips();
        document.getElementById("filterModal").classList.add("open");
      };

      document.getElementById("btnResetFilter").onclick = () => {
        filterState.color = "ALL";
        filterState.type = "ALL";
        buildFilterChips();
        renderAll();
      };

      document.getElementById("btnSort").onclick = () => {
        document.getElementById("sortModal").classList.add("open");
      };

      document.querySelectorAll("#sortChips .chip").forEach(chip => {
        chip.onclick = () => {
          document.querySelectorAll("#sortChips .chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
          filterState.sort = chip.dataset.sort;
          renderPoolStrip();
          document.getElementById("sortModal").classList.remove("open");
        };
      });

      document.getElementById("btnCopyRecipe").onclick = async () => {
        const text = document.getElementById("deckRecipeText").value;
        await navigator.clipboard.writeText(text);
        showToast("レシピをコピーしました");
      };

      document.getElementById("btnCopyShareUrl").onclick = async () => {
        const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(deck))));
        const url = `${location.origin}${location.pathname}?d=${encodeURIComponent(encoded)}`;
        await navigator.clipboard.writeText(url);
        showToast("共有URLをコピーしました");
      };

      document.querySelectorAll("[data-close]").forEach(btn => {
        btn.onclick = () => document.getElementById(btn.dataset.close).classList.remove("open");
      });

      document.querySelectorAll(".modal-backdrop").forEach(bg => {
        bg.addEventListener("click", (e) => {
          if (e.target === bg) bg.classList.remove("open");
        });
      });
    }

    async function init() {
      bindEvents();
      loadLocalOrUrl();
      try {
        const res = await fetch("./data/cards.json", { cache: "no-store" });
        const raw = await res.json();
        allCards = Array.isArray(raw) ? raw : (raw.cards || []);
      } catch (e) {
        allCards = [];
        showToast("カードデータの読み込みに失敗しました");
      }
      renderAll();
    }

    init();
  </script>
</body>
</html>
